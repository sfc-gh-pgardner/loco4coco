# Loco4CoCo booth infrastructure - DCM project manifest.
#
# Every Snowflake object the activation needs is defined as code here so it can
# be recreated on any account with one command. Before this existed, the objects
# were hand-created and the SESSIONS table silently drifted away from the app.
#
# Deploy:  python3 deploy/bootstrap.py -c <your-connection>
# Or:      snow dcm plan --target EVENT  &&  snow dcm deploy --target EVENT
#
# NOTE on project_owner: ACCOUNTADMIN is used because these are personal demo
# accounts. For a shared or production account, Snowflake's guidance is a
# dedicated deploy role granted only to a service user - see
# https://docs.snowflake.com/en/user-guide/dcm-projects/dcm-projects-use
#
# ─────────────────────────────────────────────────────────────────────────────
# YOU DO NOT NEED TO ADD A TARGET. The default EVENT target deliberately pins no
# account. The operator registers at https://go.dataops.live/emea-swt/register
# once per event and is assigned an account from a pool: the name is random
# (NDL_HACKATHON_WEHBMG and so on) and is not known until they are in front of
# it. Pasting that ID in here would be pure friction, and would invite committing
# someone's account identifier. Just point a connection at it and deploy.
#
# The account's REGION does not matter and is deliberately not pinned. It decides
# only where SESSIONS/TURNS/blueprints are written, never which Marketplace
# datasets are recommended - that is the EVENT's region, set by event.venue in
# game/config.json. Keeping the two apart is what makes the pool assignment safe.
#
# The named targets below exist only because those accounts are long-lived and
# worth pinning; EVENT is the one an event operator uses.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 2
type: DCM_PROJECT

default_target: EVENT

targets:
  # The event operator's target. No account_identifier on purpose - see above.
  # Which event this is (London/Paris/Berlin) is NOT decided here: it is the
  # event.venue toggle in game/config.json. Change it there and restart the
  # server - there is no admin screen.
  EVENT:
    project_name: LOCO4COCO_DEPLOY.PROJECTS.LOCO4COCO_BOOTH
    project_owner: ACCOUNTADMIN
    templating_config: EVENT

  LONDON:
    account_identifier: SFSEEUROPE-PG_LONDON
    project_name: LOCO4COCO_DEPLOY.PROJECTS.LOCO4COCO_BOOTH
    project_owner: ACCOUNTADMIN
    templating_config: LONDON

  # A genuinely different account AND region, so portability is proven rather
  # than assumed.
  US_WEST_DEMO:
    account_identifier: SFSEEUROPE-US_WEST_DEMO_PG
    project_name: LOCO4COCO_DEPLOY.PROJECTS.LOCO4COCO_BOOTH
    project_owner: ACCOUNTADMIN
    templating_config: US_WEST_DEMO

  # Snowflake World Tour event account (Frankfurt, eu-central-1). HOL account,
  # real ID kept local-only via git skip-worktree. Runs the SWT LONDON game.
  FRANKFURT:
    account_identifier: SFSEHOL-EMEA_SWT_FRZYKI
    project_name: LOCO4COCO_DEPLOY.PROJECTS.LOCO4COCO_BOOTH
    project_owner: ACCOUNTADMIN
    templating_config: FRANKFURT

templating:
  defaults:
    db: LOCO4COCO
    schema: BOOTH
    wh: LOCO4COCO_WH
    wh_size: XSMALL
    auto_suspend: 60
    city: London
    language: en
    # Monitor values are consumed by hooks/post_hook.sql, not by DCM - resource
    # monitors are not a supported DEFINE entity.
    monitor: LOCO4COCO_RM
    monitor_quota: 100
    # Deliberately NOT defaulted for the pinned targets. The username differs per
    # account. An empty value is fine: post_hook.sql falls back to a notify-less
    # monitor rather than failing, which is what the EVENT target relies on
    # (a freshly provisioned account's user often has no email address at all).
    monitor_notify_user: ""

  configurations:
    # The event operator's config. city/language are cosmetic here and are
    # overridden at runtime by event.venue in game/config.json - the booth picks
    # its event from that toggle, not from the deploy.
    EVENT:
      city: London
      language: en
      monitor_quota: 100
      monitor_notify_user: ""
    LONDON:
      city: London
      language: en
      monitor_quota: 100
      monitor_notify_user: PGARDNER

    US_WEST_DEMO:
      city: Test Bench
      language: en
      # Smaller quota: this target exists to prove deployment, not to run an event.
      monitor_quota: 5
      monitor_notify_user: PADDY

    # SWT London game, run on the Frankfurt HOL account. Only known user is USER.
    FRANKFURT:
      city: London
      language: en
      monitor_quota: 100
      monitor_notify_user: USER
