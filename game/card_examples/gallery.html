<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Card Gallery</title>
<style>
body { background:#2C3444; font-family:system-ui; color:#DEE5EB; padding:20px; }
h1 { color:#29B5E8; }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:20px; }
.cell { text-align:center; }
.cell img { width:100%; border:1px solid #465C6D; border-radius:6px; }
.cell img:hover { border-color:#29B5E8; }
.cell p { margin:6px 0; font-size:13px; color:#8FA6B8; }
.cell a { text-decoration:none; }
.swatch { display:inline-block; width:9px; height:9px; border-radius:2px;
  margin-right:6px; vertical-align:middle; }
.hint { color:#8FA6B8; font-size:13px; }
</style></head><body>
<h1>Loco 4 CoCo &mdash; Share Card Gallery (9 Archetypes)</h1>
<p class="hint">Pre-rendered example cards for each POC archetype. Click any
card to open it at full 1200&times;630. The swatch is that archetype's accent;
every card sits on <b style="color:#DEE5EB">#2C3444</b>.</p>
<div class="grid" id="grid"></div>
<script>
// Built in JS rather than hardcoded <img> so every src carries a cache-buster.
// The PNGs are re-exported in place after a palette change, so a plain src is
// exactly the case a browser serves from cache - you would be reviewing the
// previous scheme and have no way of knowing.
const CARDS = [
  ['talk-to-my-data',           '#29B5E8'],
  ['ask-my-documents',          '#67B5ED'],
  ['extract-from-paperwork',    '#D389E5'],
  ['triage-and-classify',       '#79BE7E'],
  ['an-agent-that-acts',        '#BD7BCD'],
  ['predict-what-happens-next', '#E5C872'],
  ['join-the-silos',            '#6D96B4'],
  ['share-without-copying',     '#6CAA71'],
  ['watch-it-live',             '#84DDE0']
];
const bust = Date.now();
document.getElementById('grid').innerHTML = CARDS.map(([n, accent]) =>
  '<div class="cell"><a href="' + n + '.png?t=' + bust + '" target="_blank">' +
  '<img src="' + n + '.png?t=' + bust + '" alt="' + n + '"></a>' +
  '<p><span class="swatch" style="background:' + accent + '"></span>' +
  n + ' &middot; ' + accent + '</p></div>').join('');
</script>
</body></html>
