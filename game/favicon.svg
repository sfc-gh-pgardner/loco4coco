<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" shape-rendering="crispEdges">
<!-- Loco for CoCo. Transcribed from the Cortex Code CLI's own sprite, which is
     stored as a character grid nine cells wide and four rows tall:
         ..PEPEP..   P body, B belly, O orange, E eye
         .PPPOPPP.   the beak is ONE centred cell
         PPPBBBPPP   widest row; the belly is only three cells
         .PPOPPPOP   feet inside the body - the CLI's sitting pose
     A terminal cell is twice as tall as wide, so a cell is 2x4 here and the
     silhouette keeps the CLI's 9:8 proportion, stepping 5 -> 7 -> 9 -> 7 cells.
     Colours are the CLI's own: body #29B5E8, belly #FDF5E6, orange #ED8D30, eye
     #1E1E2E. The body is FLAT - the CLI has no darker flipper shading.
     One licensed change, matching the game sprite: the feet come out of row D
     and sit BELOW the torso so the character can walk. -->
<rect width="20" height="20" rx="4" fill="#2C3444"/>
<!-- row A: head, 5 cells (x 5..14) -->
<rect x="5" y="1" width="10" height="4" fill="#29B5E8"/>
<!-- row B: 7 cells (x 3..16) -->
<rect x="3" y="5" width="14" height="4" fill="#29B5E8"/>
<!-- row C: 9 cells (x 1..18), the shoulders -->
<rect x="1" y="9" width="18" height="4" fill="#29B5E8"/>
<!-- row D: 7 cells (x 3..16) -->
<rect x="3" y="13" width="14" height="4" fill="#29B5E8"/>
<!-- belly: three cells, row C only -->
<rect x="7" y="9" width="6" height="4" fill="#FDF5E6"/>
<!-- eyes: E is the lower half of its cell in row A -->
<rect x="7" y="3" width="2" height="2" fill="#1E1E2E"/>
<rect x="11" y="3" width="2" height="2" fill="#1E1E2E"/>
<!-- beak: one centred orange cell, row B -->
<rect x="9" y="5" width="2" height="4" fill="#ED8D30"/>
<!-- feet: lifted out of row D to below the torso -->
<rect x="5" y="17" width="2" height="2" fill="#ED8D30"/>
<rect x="13" y="17" width="2" height="2" fill="#ED8D30"/>
</svg>
