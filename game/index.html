  }catch(e){ showErr('cannot reach server'); }
}
$('c-coco-choose').addEventListener('click',()=>{
  const v=ST.visitor||{}, ind=(CFG.industries[v.industry]||{}).name||'your sector';
  const held=(ST.held||[]).slice(0,2).join(' and ')||'your data';
  const joined=(ST.joined||[]).slice(0,1)[0]||'';
  const text='Build the most impactful thing for '+ind+' using '+held
    +(joined?' joined with '+joined:'');
  $('c-compose').value=text;
  submitPanel();
});
$('c-go').addEventListener('click',submitPanel);
// The cue updates as they scroll and disappears once nothing is left below.
// Tapping it scrolls, so it works as a control and not only as a label.
$('c-scroll').addEventListener('scroll',syncMore);
$('c-more').addEventListener('click',()=>{
  const sc=$('c-scroll');
  sc.scrollBy({top:Math.round(sc.clientHeight*0.8),behavior:'smooth'});
});

// While a POV desk is open and awaiting CoCo, surface the reply in-scene.
function paintScenePanel(s){
  if(!panelOpen || !isPov(panelLoc) || inScenePhase!=='await') return;
  const say=$('c-say');
  if(s.thinking){
    const last=(s.reasoning||[]).slice(-1)[0]||'Processing your request\u2026';
    say.innerHTML='<b>CoCo</b>'+esc(last);
  } else if(s.reply){
    inScenePhase='reply'; visited.add(panelLoc);
    say.innerHTML='<b>CoCo</b>'+esc(s.reply);
    const leave = {library:'LEAVE THE LIBRARY', marketplace:'LEAVE THE STALL',
                   workshop:'LEAVE THE WORKSHOP'}[panelLoc] || 'STEP AWAY';
    $('c-go').disabled=false; $('c-go').textContent=leave;
    // Walk them back out. Standing in a finished room waiting to be told to
    // leave is dead time on a five minute budget, and the reply is not lost:
    // paintBubble adopts it in the top thought bubble on the way out.
    startAutoLeave();
  }
}

let autoLeaveT=0;
const AUTO_LEAVE_MS=3000;          // long enough to read a 40 word reply
function startAutoLeave(){
  clearTimeout(autoLeaveT);
  const at=panelLoc;
  autoLeaveT=setTimeout(()=>{
    if(!panelOpen || panelLoc!==at || inScenePhase!=='reply') return;
    visited.add(at); closePanel();
  },AUTO_LEAVE_MS);
}
function cancelAutoLeave(){ clearTimeout(autoLeaveT); autoLeaveT=0; }

// ---------------- the shareable card ----------------
// A visitor leaves with a document nobody else sees. This is the other half:
// one 1200x630 pixel-art image, sized for a LinkedIn post, showing CoCo standing
// in a scene that matches the POC they designed.
//
// It is drawn, not generated. There is no image model in the loop, no latency and
// no cost: every archetype has a precomputed palette and a motif, and the card is
// those parts assembled with the visitor's own words on top. That is the whole
// trick - the decision tree already tells us the finite set of things a visitor
// can end up with, so the art can be built in advance and pieced together.
const CARD_W=1200, CARD_H=630;
const CARD_THEMES={
  'talk-to-my-data':        {sky:['#0B2A3F','#1E5A7A'], accent:'#29B5E8', motif:'chart',    tag:'Talk to my data'},
  'ask-my-documents':       {sky:['#122036','#2F4F7A'], accent:'#7DD3F0', motif:'docs',    tag:'Ask my documents'},
  'extract-from-paperwork': {sky:['#1B1B33','#40407A'], accent:'#B39DFF', motif:'form',    tag:'Extract from paperwork'},
  'triage-and-classify':    {sky:['#0E2B2B','#1F6060'], accent:'#4FD1B0', motif:'bins',    tag:'Triage and classify'},
  'an-agent-that-acts':     {sky:['#2A1633','#5C2A6B'], accent:'#E88BD8', motif:'agent',   tag:'An agent that acts'},
  'predict-what-happens-next':{sky:['#1A1030','#3D2070'], accent:'#FF7FAF', motif:'trend', tag:'Predict what happens next'},
  'join-the-silos':         {sky:['#101F2E','#2B4A66'], accent:'#8FD4F5', motif:'silos',   tag:'Join the silos'},
  'share-without-copying':  {sky:['#0E2620','#1F5A46'], accent:'#5FD9A0', motif:'share',   tag:'Share without copying'},
  'watch-it-live':          {sky:['#2B1220','#6B2440'], accent:'#FF7FA8', motif:'stream',  tag:'Watch it live'}
};
// Per-motif vertical nudge, so every motif's visual bottom lands on the same
// ground plane as CoCo's feet. Measured, not guessed.
const MOTIF_LIFT={chat:34,docs:-6,form:-14,bins:-18,agent:26,chart:-10,
                  trend:-14,silos:-8,share:2,stream:6};
function cardTheme(){
  const a=(ST.poc||{}).archetype||'';
  return CARD_THEMES[a]||CARD_THEMES['talk-to-my-data'];
}
// One pixel unit for the card, so everything stays on a grid and reads as sprite
// art rather than as smooth vector shapes shrunk down.
function cpx(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }

function drawCardMotif(g,kind,cx,cy,u,accent){
  const A=accent, D='#EAF6FD', S2='rgba(255,255,255,.20)';
  if(kind==='chat'){
    // iMessage-style: user asks (accent, left), reply (white, right)
    const msgs=[
      {w:7, h:2.5, side:'l', c:A},
      {w:8, h:2.5, side:'r', c:D},
      {w:8, h:2.5, side:'l', c:A},
      {w:7, h:2.5, side:'r', c:D},
    ];
    let ty=cy+u*5;
    for(const m of msgs){
      ty-=m.h*u+u*1.3;
      const bx=m.side==='r'? cx+u*1 : cx-m.w*u-u*1;
      cpx(g,bx,ty,m.w*u,m.h*u,m.c);
      // tail
      if(m.side==='r') cpx(g,bx+m.w*u-u*0.5,ty+m.h*u,u*1.3,u*0.8,m.c);
      else cpx(g,bx,ty+m.h*u,u*1.3,u*0.8,m.c);
      // text line
      const lc=m.c===A?'rgba(255,255,255,.5)':'rgba(0,0,0,.25)';
      cpx(g,bx+u*1.2,ty+m.h*u/2-u*0.3,m.w*u-u*2.5,u*0.7,lc);
    }
    // table icon, positioned fully clear to the right of the bubble stack
    const tx=cx+u*12, tby=cy-u*6;
    cpx(g,tx,tby,u*6,u*5.5,D);          // table body
    cpx(g,tx,tby,u*6,u*1.3,A);          // header row
    cpx(g,tx+u*2.8,tby+u*1.3,u*0.6,u*4.2,'rgba(0,0,0,.15)'); // col divider
    cpx(g,tx,tby+u*2.8,u*6,u*0.4,'rgba(0,0,0,.12)');  // row divider
    cpx(g,tx,tby+u*4.2,u*6,u*0.4,'rgba(0,0,0,.12)');  // row divider
  } else if(kind==='docs'){
    // Stack of 3 offset pages with correctly centred text lines
    for(let i=0;i<3;i++){
      const px=cx-u*4.5+i*u*1.5, py=cy-u*5+i*u*2;
      cpx(g,px,py,u*10,u*13,i===2?A:D);
    }
    // text lines on front page, centred within it
    const fx=cx-u*4.5+u*3+u*1.5, fy=cy-u*5+u*4+u*2;
    for(let r=0;r<5;r++) cpx(g,fx,fy+r*u*1.8,u*6,u*0.8,'rgba(0,0,0,.35)');
  } else if(kind==='form'){
    cpx(g,cx-u*6,cy-u*8,u*12,u*15,D);
    for(let r=0;r<5;r++){ cpx(g,cx-u*4,cy-u*6+r*u*2.6,u*2,u*2,A);
      cpx(g,cx-u*1,cy-u*5.6+r*u*2.6,u*5,u*1.2,'rgba(0,0,0,.35)'); }
  } else if(kind==='bins'){
    // Three sorting bins (trays) with items falling into them
    for(let i=0;i<3;i++){
      const bx=cx-u*9+i*u*7;
      // bin body (open top)
      cpx(g,bx,cy-u*1,u*5,u*8,i===1?A:D);
      cpx(g,bx-u*0.5,cy-u*2,u*6,u*1.5,i===1?A:D); // rim
      // item inside bin
      cpx(g,bx+u*1,cy+u*2,u*3,u*2,S2);
    }
    // falling items above bins
    cpx(g,cx-u*7,cy-u*6,u*2.5,u*2.5,S2);
    cpx(g,cx-u*0.5,cy-u*8,u*2.5,u*2.5,A);
    cpx(g,cx+u*6,cy-u*5,u*2.5,u*2.5,S2);
    // dotted arrows above
    cpx(g,cx-u*6.5,cy-u*4,u*0.8,u*1.5,S2);
    cpx(g,cx,cy-u*5.5,u*0.8,u*1.5,A);
    cpx(g,cx+u*6.5,cy-u*3.5,u*0.8,u*1.5,S2);
  } else if(kind==='agent'){
    cpx(g,cx-u*5,cy-u*6,u*10,u*9,D); cpx(g,cx-u*3,cy-u*4,u*2.5,u*2.5,A);
    cpx(g,cx+u*0.5,cy-u*4,u*2.5,u*2.5,A);
    cpx(g,cx-u*2,cy+u*1,u*4,u*1.2,'rgba(0,0,0,.4)');
    cpx(g,cx-u*0.6,cy-u*9,u*1.2,u*3,D); cpx(g,cx-u*2,cy-u*11,u*4,u*2,A);
  } else if(kind==='chart'){
    // Bar chart (compact, lower) with speech bubble clearly above
    [4,7,5,9,6].forEach((h,i)=>cpx(g,cx-u*8+i*u*3.5,cy+u*6-h*u,u*2.8,h*u,i===3?A:D));
    // speech bubble well above the bars
    cpx(g,cx-u*5,cy-u*13,u*12,u*5.5,A);
    cpx(g,cx-u*1,cy-u*7.5,u*2,u*1.8,A); // tail pointing down
    // text lines inside bubble
    cpx(g,cx-u*3.5,cy-u*12,u*8,u*0.8,'rgba(0,0,0,.3)');
    cpx(g,cx-u*3.5,cy-u*10.5,u*6,u*0.8,'rgba(0,0,0,.3)');
  } else if(kind==='trend'){
    // Bars in subtle green, dot-line in PINK (not orange) to avoid cigarette look
    const G='rgba(80,200,140,.55)', PK='#FF7FAF';
    for(let i=0;i<7;i++){
      const h=(3+i*1.4)*u;
      cpx(g,cx-u*10+i*u*3,cy+u*6-h,u*2.2,h,i>4?PK:G);
    }
    for(let i=0;i<7;i++){
      const nx=cx-u*10+i*u*3, ny=cy+u*6-(3+i*1.4)*u-u*2.4;
      cpx(g,nx,ny,u*2.2,u*2.2,i>4?PK:D);
      if(i<6) cpx(g,nx+u*2.2,ny-u*0.8,u*0.9,u*2.4,i>3?PK:D);
    }
    cpx(g,cx-u*11,cy+u*6,u*24,u*0.9,D);
  } else if(kind==='silos'){
    // Three silos with connecting bridges between them showing JOIN
    for(let i=0;i<3;i++){
      const bx=cx-u*10+i*u*8;
      const col=i===1?A:D;
      // silo body
      cpx(g,bx,cy-u*4,u*5,u*10,col);
      // dome top
      cpx(g,bx+u*0.5,cy-u*6,u*4,u*2.5,col);
      cpx(g,bx+u*1,cy-u*7.5,u*3,u*2,col);
      cpx(g,bx+u*1.8,cy-u*8.5,u*1.4,u*1.5,col);
    }
    // horizontal bridges connecting silos (the JOIN)
    cpx(g,cx-u*5,cy-u*1,u*4,u*1.5,A);
    cpx(g,cx+u*3,cy-u*1,u*4,u*1.5,A);
    // arrows on bridges pointing both ways
    cpx(g,cx-u*5.5,cy-u*2,u*1.2,u*3.5,A);
    cpx(g,cx-u*1.5,cy-u*2,u*1.2,u*3.5,A);
    cpx(g,cx+u*2.5,cy-u*2,u*1.2,u*3.5,A);
    cpx(g,cx+u*6.5,cy-u*2,u*1.2,u*3.5,A);
    // data flowing through bridges (small squares)
    cpx(g,cx-u*4,cy-u*0.5,u*1,u*1,D);
    cpx(g,cx-u*2.5,cy-u*0.5,u*1,u*1,D);
    cpx(g,cx+u*4,cy-u*0.5,u*1,u*1,D);
    cpx(g,cx+u*5.5,cy-u*0.5,u*1,u*1,D);
  } else if(kind==='share'){
    // Two people/screens with a glowing link between them - fun and playful
    // Left screen
    cpx(g,cx-u*12,cy-u*5,u*8,u*10,D);
    cpx(g,cx-u*11,cy-u*4,u*6,u*8,'#0B1A24');
    // data bars on left screen
    cpx(g,cx-u*10,cy-u*2,u*4,u*0.8,S2);
    cpx(g,cx-u*10,cy-u*0.2,u*3,u*0.8,S2);
    cpx(g,cx-u*10,cy+u*1.6,u*4.5,u*0.8,A);
    // Right screen (mirror)
    cpx(g,cx+u*5,cy-u*5,u*8,u*10,A);
    cpx(g,cx+u*6,cy-u*4,u*6,u*8,'#0B1A24');
    // same data bars on right screen (it's shared!)
    cpx(g,cx+u*7,cy-u*2,u*4,u*0.8,S2);
    cpx(g,cx+u*7,cy-u*0.2,u*3,u*0.8,S2);
    cpx(g,cx+u*7,cy+u*1.6,u*4.5,u*0.8,D);
    // glowing link arc between them
    for(let i=0;i<5;i++){
      const px=cx-u*3.5+i*u*2, py=cy-u*2-Math.sin(i/4*Math.PI)*u*3;
      cpx(g,px,py,u*1.4,u*1.4,A);
    }
    // sparkle bursts
    cpx(g,cx-u*1,cy-u*7,u*1.2,u*1.2,A);
    cpx(g,cx+u*2,cy-u*6.5,u*0.9,u*0.9,D);
    cpx(g,cx+u*0.5,cy-u*8.5,u*0.9,u*0.9,A);
  } else if(kind==='stream'){
    // Was eight scattered squares beside a bare bar, which read as a rendering
    // glitch rather than as a stream. It needs an object: a monitor with a live
    // trace running across it, and a queue feeding in from the left.
    cpx(g,cx-u*11,cy-u*8,u*22,u*15,D);                  // bezel
    cpx(g,cx-u*10,cy-u*7,u*20,u*13,'#0B1A24');          // screen
    for(let i=0;i<19;i++){                              // the trace
      const yy=cy-u*0.5+Math.sin(i*0.8)*u*4.2;
      cpx(g,cx-u*10+i*u,yy,u*1.1,u*1.1,i>14?A:D);
    }
    cpx(g,cx-u*10,cy+u*4.6,u*20,u*0.8,'rgba(255,255,255,.18)');
    for(let i=0;i<4;i++)                                // queue feeding in
      cpx(g,cx-u*15+i*u*1.6,cy-u*1+((i%2)?-u:u),u*1.3,u*1.3,A);
    cpx(g,cx-u*4,cy+u*7,u*8,u*3,D);                     // stand
  }
}

function wrapText(g,text,maxW){
  const words=String(text||'').split(/\s+/).filter(Boolean), lines=[];
  let cur='';
  words.forEach(wd=>{
    const t=cur?cur+' '+wd:wd;
    if(g.measureText(t).width>maxW && cur){ lines.push(cur); cur=wd; } else cur=t;
  });
  if(cur) lines.push(cur);
  return lines;
}

function buildShareCard(){
  const cv=document.createElement('canvas');
  cv.width=CARD_W; cv.height=CARD_H;
  const g=cv.getContext('2d');
  g.imageSmoothingEnabled=false;
  const th=cardTheme(), v=ST.visitor||{}, poc=ST.poc||{};

  // sky
  const sky=g.createLinearGradient(0,0,0,CARD_H);
  sky.addColorStop(0,th.sky[0]); sky.addColorStop(1,th.sky[1]);
  g.fillStyle=sky; g.fillRect(0,0,CARD_W,CARD_H);
  // stars, on a grid so they stay pixels
  for(let i=0;i<90;i++){
    const x=(i*137)%CARD_W, y=(i*61)%Math.round(CARD_H*0.55);
    cpx(g,x,y,3,3,i%4?'rgba(255,255,255,.30)':'rgba(255,255,255,.65)');
  }
  // ground: two bands of snow
  const GR=Math.round(CARD_H*0.64);
  cpx(g,0,GR,CARD_W,CARD_H-GR,'#DCEAF2');
  cpx(g,0,GR,CARD_W,10,'#FFFFFF');
  cpx(g,0,GR+56,CARD_W,6,'rgba(41,181,232,.20)');

  // the motif stands to CoCo's right, at POC scale
  // Motifs are anchored to the ground rather than to a fixed offset: measured
  // bottoms varied by 50px across the ten, so 'agent' floated in the sky while
  // 'docs' sat on the snow. MOTIF_LIFT lands each one on the same plane.
  const lift=MOTIF_LIFT[th.motif]||0;
  drawCardMotif(g,th.motif,Math.round(CARD_W*0.775),GR-40-lift,11,th.accent);
  // CoCo himself, reusing the in-game sprite so the card and the game agree
  drawCoCoFront(g,Math.round(CARD_W*0.545),GR+22,9);

  // text column
  const PADX=64;
  g.textBaseline='top';
  g.fillStyle=th.accent;
  g.font='700 22px ui-monospace,SFMono-Regular,Menlo,monospace';
  g.fillText(th.tag.toUpperCase(),PADX,64);

  g.fillStyle='#FFFFFF';
  g.font='700 52px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const lines=wrapText(g,poc.poc_name||'My Snowflake proof of concept',
                       Math.round(CARD_W*0.44));
  lines.slice(0,3).forEach((ln,i)=>g.fillText(ln,PADX,104+i*58));

  let y=104+Math.min(lines.length,3)*58+16;
  g.fillStyle='rgba(255,255,255,.80)';
  g.font='400 24px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const feats=(poc.features||[]).slice(0,3).join('  |  ');
  if(feats) g.fillText(feats,PADX,y);

  // footer strip: who, where, how long. The time is the boast.
  cpx(g,0,CARD_H-92,CARD_W,92,'rgba(6,14,20,.88)');
  g.fillStyle='#FFFFFF';
  g.font='700 26px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const el=Math.max(0,Math.round(Date.now()/1000-(ST.started_at||Date.now()/1000)));
  const mm=Math.floor(el/60), ss=el%60;
  g.fillText('Built in '+mm+':'+String(ss).padStart(2,'0')+' with Cortex Code',
             PADX,CARD_H-66);
  g.fillStyle='rgba(255,255,255,.62)';
  g.font='400 20px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const city=((CFG.event||{}).city)||'';
  g.fillText((v.first_name||'A visitor')+' at Snowflake World Tour '+city,
             PADX,CARD_H-34);

  // The mark, bottom right. The full wordmark rather than the symbol alone: this
  // image is going onto someone's LinkedIn feed, where a bare symbol at 30px is
  // just a blue blob and the word is the whole point of them posting it.
  // Aspect is the file's own, 3840x919.
  const lw=286, lh=Math.round(lw*919/3840);
  if(!drawImgSmooth(g,'wordmark',CARD_W-lw-46,CARD_H-lh-38,lw,lh)){
    // The card can be built the instant the page loads, before the asset has
    // arrived. A missing logo must not cost the visitor their card.
    g.fillStyle='#29B5E8'; g.font='700 34px ui-sans-serif,system-ui,sans-serif';
    g.textAlign='right'; g.fillText('snowflake',CARD_W-46,CARD_H-44);
    g.textAlign='left';
  }
  return cv;
}

function saveShareCard(){
  try{
    const cv=buildShareCard();
    const a=document.createElement('a');
    const nm=((ST.visitor||{}).first_name||'visitor').replace(/[^A-Za-z0-9]/g,'');
    a.download='loco4coco-'+nm+'.png';
    a.href=cv.toDataURL('image/png');
    a.click();
    const b=$('done-card');
    if(b){ b.textContent='SAVED \u2713';
      setTimeout(()=>{ b.textContent='SAVE MY CARD'; },2000); }
  }catch(e){ showErr('could not build the card'); }
}

function showDoneSummary(){
  const v=ST.visitor||{}, poc=ST.poc||{};
  $('done-who').textContent=(v.first_name||'Visitor')
    +(v.company?' @ '+v.company:'');
  $('done-poc').textContent='POC: '+(poc.poc_name||'your proof of concept');
  const nf=(poc.features||[]).length;
  $('done-feats').textContent='Features: '+nf+(nf?(' \u2014 '+(poc.features||[]).join(', ')):'');
  // elapsed from started_at
  const elapsed=Math.round(Date.now()/1000-(ST.started_at||Date.now()/1000));
  const mm=Math.floor(elapsed/60), ss=elapsed%60;
  $('done-time').textContent='Completed in '+mm+':'+String(ss).padStart(2,'0');
  // Render the card straight away, so the visitor sees the thing they are
  // being offered rather than a button promising one.
  // The card is drawn here, but it must not STAY here. The booth machine is a
  // shared demo laptop: the visitor cannot download to it and walks away from
  // it. So the canvas goes to the server, which stages it as a real PNG and
  // presigns it, and the visitor scans it onto their own phone.
  try{
    const png=buildShareCard().toDataURL('image/png');
    $('done-cardimg').src=png;
    handoverCard(png);
  }
  catch(e){ $('done-cardimg').style.display='none';
    $('done-cardhint').textContent='Could not build your card.'; }
  $('ov-done').style.display='';
  $('ov-done').classList.add('on');
}
// Stage the card and show a QR for it. Failure is not fatal: the visitor still
// has their blueprint QR, and the operator can fall back to the copy button.
async function handoverCard(dataUrl){
  const hint=$('done-cardhint');
  try{
    // post() resolves to the fetch Response, NOT the parsed body. Reading
    // r.url off it gave the REQUEST url, so the QR encoded
    // http://127.0.0.1:4747/api/card - a booth laptop address, on a stranger's
    // phone, which of course did nothing.
    const res=await post('/api/card',{png:dataUrl});
    const r=await res.json();
    if(!r || !r.url) throw new Error((r && r.error) || 'no url');
    const qr=$('done-qr');
    qr.onerror=()=>{ hint.textContent='Card staged, but the QR could not be '
      +'drawn. Ask us for the link.'; };
    qr.src='/api/qr?u='+encodeURIComponent(r.url);
    $('done-hand').style.display='flex';
    hint.style.display='none';
  }catch(e){
    hint.textContent='Your card is on screen, but we could not put it on a code.'
      +' Ask us and we will send it with your plan.';
  }
}
$('done-card').addEventListener('click',saveShareCard);
$('done-reset').addEventListener('click',async ()=>{
  $('done-reset').disabled=true;
  $('done-reset').textContent='RESETTING\u2026';
  try { await post('/api/reset',{}); } catch(e){}
  location.reload();
});

// Reveal the second library question once the first has an answer. Called from
// the option toggles and from the free-text box, so either route unlocks it.
async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!r.ok) showErr('rejected: '+(await r.text()).slice(0,90)); else showErr('');
  return r;
}

// ---------------- reasoning tray ----------------
let trayOpen=false, thinkSince=0, bpShown=false;
$('trayhead').addEventListener('click',()=>{
  trayOpen=!trayOpen;
  $('traybody').classList.toggle('on',trayOpen);
  $('traychev').innerHTML = trayOpen?'HIDE WORK &#9652;':'SHOW WORK &#9662;';
  // The open tray body adds height the fixed chrome budget excludes, so re-fit
  // to keep its scrollable 132px inside the viewport.
  fitCanvas();
});
function paintTray(s){
  const lines=s.reasoning||[];
  // Honesty rule: the tray exists to show CoCo's REAL reasoning. The fast
  // (non-agentic) turns have none, so the tray is hidden for them rather than
  // filled with a decorative spinner. It belongs to the exec turns only.
  const agentic = (s.transport||'exec')==='exec';
  // visibility, not display: hiding the box entirely collapsed the chrome and
  // shifted the board mid-turn. The slot stays, the content goes.
  $('tray').style.visibility = agentic ? '' : 'hidden';
  if(!agentic){ thinkSince=0; return; }
  $('trayhead').classList.toggle('live',!!s.thinking);
  if(s.thinking && !thinkSince) thinkSince=Date.now();
  if(!s.thinking) thinkSince=0;
  const last=lines.length?lines[lines.length-1]:'';
  if(s.thinking){
    // A truthful elapsed counter, because the first real reasoning line can be
    // 30 seconds away and a frozen label reads as a hang.
    const secs=thinkSince?Math.floor((Date.now()-thinkSince)/1000):0;
    $('traynow').textContent=(last||'CoCo is working this out...')+`  (${secs}s)`;
  } else {
    $('traynow').textContent = lines.length?`Done \u00b7 ${lines.length} steps`:'Idle';
  }
  if(trayOpen){
    const b=$('traybody');
    if(b.dataset.n!==String(lines.length)){
      b.dataset.n=String(lines.length);
      b.innerHTML=lines.map(l=>`<div>${esc(l)}</div>`).join('');
      b.scrollTop=b.scrollHeight;
    }
  }
}

// ---------------- history ----------------
function stepHist(d){
  const n=(ST.turns||[]).length; if(!n) return;
  if(histIdx===null) histIdx = d<0 ? n-1 : null;
  else { histIdx+=d; if(histIdx>=n||histIdx<0) histIdx=null; }
  paintBubble(ST);
}
$('h-prev').addEventListener('click',()=>stepHist(-1));
$('h-next').addEventListener('click',()=>stepHist(1));

function paintBubble(s){
  const turns=s.turns||[], n=turns.length;
  $('h-prev').disabled = n===0 || histIdx===0;
  $('h-next').disabled = histIdx===null;
  $('h-at').textContent = n? (histIdx===null?`now \u00b7 ${n}`:`${histIdx+1} / ${n}`) : '';
  $('histback').classList.toggle('on',histIdx!==null);

  if(nudgeUntil>Date.now()){ setMessage(nudgeMsg); $('yousaid').classList.remove('on'); return; }

  // While a POV desk is open, CoCo speaks in-scene only. Mirroring the reply up
  // here as well was the repetition: the same words in the bubble, in #c-say,
  // and echoed again by "You said" over a panel that already shows the choice.
  if(panelOpen && isPov(panelLoc) && histIdx===null){
    $('yousaid').classList.remove('on');
    const l=CFG.locations[panelLoc]||{};
    setMessage(l.narrative?fillCli(l.narrative,s):'');
    return;
  }

  let msg, said='';
  if(histIdx!==null && turns[histIdx]){
    msg=turns[histIdx].reply; said=turns[histIdx].text;
  } else if(s.thinking){
    msg=typeTarget || 'Let me think about that...';
  } else if(s.reply){
    msg=s.reply; const t=turns[n-1]; said=t?t.text:'';
  } else {
    // Only an UNLOCKED location may narrate. The penguin starts on the postbox
    // tile, so without this a fresh 0/4 session opened with the closing line.
    // And the movement hint is gated on the map actually being live: it was
    // firing throughout the house stage, telling a visitor to walk around with
    // WASD while they still had no control of anything.
    const l=(nearId&&unlocked(nearId))?CFG.locations[nearId]:null;
    const onMap = !openingActive();
    msg = l&&l.narrative ? fillCli(l.narrative,s)
        : (haveVisitor() && onMap
            ? `Use WASD or the arrows, ${esc((s.visitor||{}).first_name)}. Walk up to a place and press E.`
            : (onMap ? 'Press E when you reach somewhere interesting.' : ''));
  }
  $('yousaid').classList.toggle('on',!!said);
  if(said) $('yousaid').textContent='You said: '+said;
  setMessage(msg||'', histIdx!==null);
}
function fillCli(t,s){
  const v=s.visitor||{};
  return t.replace(/\{first_name\}/g,v.first_name||'there')
          .replace(/\{company\}/g,v.company||'your organisation')
          .replace(/\{email\}/g,v.email||'you');
}

// ---------------- state ----------------
function onState(s){
  const firstLoad = !ST.updated_at;
  ST=s;
  (s.turns||[]).forEach(t=>visited.add(t.location));
  const v=s.visitor||{};
  $('h-name').textContent=v.first_name||'\u2014';
  $('h-ind').textContent=(CFG.industries[v.industry]||{}).name||'\u2014';
  $('h-col').textContent=`${visited.size} / ${Object.keys(CFG.locations).length}`;
  if(s.started_at && haveVisitor()){
    // Counts UP, not down: the clock is there to create a little urgency, not
    // to threaten a cliff. It keeps counting past the limit, and the one-time
    // notice at the limit is a soft nudge the visitor can dismiss.
    const elapsed=Date.now()/1000-s.started_at;
    const limit=CFG.event.time_limit_seconds||300;
    $('h-time').textContent=`${Math.floor(elapsed/60)}:${String(Math.floor(elapsed%60)).padStart(2,'0')}`;
    $('h-time').style.color=elapsed>=limit?'#E8863C':'';
    if(elapsed>=limit && !overNudged && s.stage!=='done'){ overNudged=true;
      nudge('That is five minutes - no rush, but let us get your present in the post when you are ready. (tap to dismiss)',6000); }
  } else { $('h-time').textContent='0:00'; }
  const ids=Object.keys(CFG.locations), bar=$('stagebar');
  if(bar.children.length!==ids.length) bar.innerHTML=ids.map(()=>'<div></div>').join('');
  [...bar.children].forEach((d,i)=>{
    d.className = visited.has(ids[i])?'on':(nearId===ids[i]?'cur':''); });

  const opening = $('ov-title').classList.contains('on')
    || $('ov-arctic').classList.contains('on') || $('ov-letter').classList.contains('on')
    || $('ov-home').classList.contains('on')
    || openingActive();
  $('banner').classList.toggle('on', !haveVisitor() && !opening);
  if(!haveVisitor() && !opening && firstLoad) openTitle();
  sceneThinking = !!s.thinking;
  paintTray(s);
  paintBubble(s);
  paintScenePanel(s);
}

// ---------------- ask CoCo one thing ----------------
// NOT auto-opened. An overlay that appears on its own is wrong here: it fired
// off the back of a leftover POC in state and covered the START button. The
// endpoint and the card stay, to be wired in as a DELIBERATE step in the flow
// (its own beat after the Workshop, or its own tile) rather than a popup.
function openAsk(){
  const a=CFG.ask||{};
  if(!a.enabled) return;
  $('a-head').textContent=a.heading||'Ask CoCo one thing';
  $('a-hint').textContent=a.hint||'';
  $('a-text').placeholder=a.placeholder||'';
  $('a-text').value='';
  $('a-go').textContent=a.button||'ASK COCO';
  $('a-skip').textContent=a.skip||'SKIP THIS';
  $('ov-ask').classList.add('on');
  setTimeout(()=>$('a-text').focus(),50);
}
$('a-skip').addEventListener('click',()=>$('ov-ask').classList.remove('on'));
$('a-go').addEventListener('click',async()=>{
  const text=$('a-text').value.trim(); if(!text) return;
  $('a-go').disabled=true; $('a-go').textContent='ASKING\u2026';
  try{ await post('/api/ask',{text}); $('ov-ask').classList.remove('on'); }
  catch(e){ showErr('cannot reach server'); }
  $('a-go').disabled=false; $('a-go').textContent=(CFG.ask||{}).button||'ASK COCO';
});
$('a-text').addEventListener('keydown',e=>{ if(e.key==='Enter') $('a-go').click(); });

let typeTarget='',typeI=0;
// Recalled messages render INSTANTLY. The typewriter belongs to a reply that is
// arriving now; replaying it while scrolling back through history makes an
// already-read message feel like it is being generated again.
function setMessage(m,instant){
  if(m===typeTarget) return;
  typeTarget=m; typeI=0;
  if(instant){ typeI=m.length; const el=$('d-msg'); el.textContent=m; el.scrollTop=0; }
}
function stepType(){ if(typeI<typeTarget.length){ typeI+=2;
  const el=$('d-msg'); el.textContent=typeTarget.slice(0,typeI);
  // Keep the freshly typed tail visible when a reply is long enough to scroll.
  el.scrollTop=el.scrollHeight; } }

async function poll(){
  try{ const r=await fetch('/api/state',{cache:'no-store'});
    if(r.ok){ onState(await r.json()); }
  }catch(e){ showErr('state unavailable \u2014 is server.py running?'); }
}

function loop(){ tick++; stepMovement(); if(tick%2===0) stepType(); render();
  if(sceneActive) drawScene(sceneActive); requestAnimationFrame(loop); }

// The board was previously sized once at load, so moving the window at the
// booth left it mis-sized until a reload.
// The chrome budget is measured ONCE, at first fit, and reused. Measuring it
// live meant a long reply (or the tray hiding itself on a fast turn) changed the
// board size mid-turn, which read as the whole page sliding downwards.
let chromeReserve=0;
function fitCanvas(){
  const cv=$('cv'); if(!cv) return;
  if(!chromeReserve){
    chromeReserve=$('bubble').offsetHeight+$('hud').offsetHeight
                 +$('tray').offsetHeight+58;
  }
  const chrome=chromeReserve+(trayOpen?140:0);
  const w=Math.max(320,Math.min(innerWidth-24,1056,(innerHeight-chrome)*COLS/ROWS));
  cv.style.width=Math.round(w)+'px';
  cv.style.height=Math.round(w*ROWS/COLS)+'px';
  if($('ov-loc').classList.contains('pov')) sizePovCard();
  else syncSceneBuffer();
}

(async function init(){
  try{ CFG=await (await fetch('/api/config')).json(); }
  catch(e){ showErr('cannot load config.json'); return; }
  T=CFG.render.tile; S=CFG.render.scale; COLS=CFG.render.cols; ROWS=CFG.render.rows;
  const cv=$('cv'); cv.width=COLS*T*S; cv.height=ROWS*T*S;
  ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const sc=$('scene'); sc.width=COLS*T*S; sc.height=ROWS*T*S;
  sceneW=sc.width; sceneH=sc.height;
  sceneCtx=sc.getContext('2d'); sceneCtx.imageSmoothingEnabled=false;
  fitCanvas();
  addEventListener('resize',()=>{ chromeReserve=0; fitCanvas(); });
  document.documentElement.style.setProperty('--panel',CFG.theme.panel);
  document.documentElement.style.setProperty('--edge',CFG.theme.panel_edge);
  $('b-title').textContent=CFG.event.title;
  $('b-sub').textContent=CFG.event.subtitle.toUpperCase();
  // Unconditionally, not inside openTitle(): a visitor resuming mid-session
  // never sees the title card, and the handover and card panels would render
  // empty for them.
  paintScreenCopy();
  // Attribution, from config so a different operator can put their own name on
  // their own stand without touching the markup.
  const by=(CFG.event.byline||'').trim();
  $('b-by').textContent=by; $('b-by').style.display=by?'':'none';
  P.x=P.px=CFG.penguin.start[0]; P.y=P.py=CFG.penguin.start[1];
  buildMap(); await loadOptions(); await poll();
  if(!haveVisitor()) openTitle();
  setInterval(poll,CFG.server.poll_ms); loop();
})();
</script>
