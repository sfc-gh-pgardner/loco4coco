<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loco for CoCo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<style>
  :root { --panel:#101C27; --edge:#29B5E8; --text:#EAF6FD; --warm:#E8863C;
          --dim:#7FA8C2; --line:#1E3446; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0A121A; color:var(--text);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; overflow:hidden; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center;
    gap:7px; padding:8px 10px; }
  /* The bubble/tray/hud must render at their natural height and never be squeezed
     by the column flex - shrinking them spilled the bubble's text over the tray.
     The chrome is a FIXED budget: it must not change height mid-turn, or the
     board is re-fitted under the visitor and the whole page appears to slide
     downwards as CoCo's reply lands. */
  #bubble, #tray, #hud, #stagebar { flex:0 0 auto; }

  /* While a POV location panel is open, the chrome above the board is dead
     weight: the panel restates CoCo's question and carries its own status, so
     the bubble and the work tray are duplicating themselves while stealing
     ~150px from the interior. On a 768-tall laptop that was the difference
     between a room and a letterbox slot - sizePovCard() floored the scene at
     190px because the chrome plus the panel's 340px reservation left nothing.
     Hidden with display:none rather than visibility, so the flex column
     actually gives the height back. Restored the moment the panel closes. */
  #wrap.povfocus #bubble, #wrap.povfocus #tray { display:none; }
  .rail { width:100%; max-width:1056px; }

  /* ---------- CoCo's thought bubble: the ONLY place narrative appears ------- */
  #bubble { position:relative; background:#16283A; border:3px solid var(--edge);
    border-radius:14px; padding:11px 15px 12px; min-height:62px;
    box-shadow:0 0 26px rgba(41,181,232,.16); }
  #bubble:after, #bubble:before { content:''; position:absolute; left:56px;
    width:0; height:0; border-style:solid; }
  #bubble:before { bottom:-15px; border-width:15px 13px 0 0;
    border-color:var(--edge) transparent transparent transparent; }
  #bubble:after { bottom:-10px; border-width:11px 9px 0 0;
    border-color:#16283A transparent transparent transparent; }
  #bubble .who { color:var(--warm); font-size:10px; letter-spacing:.18em;
    text-transform:uppercase; display:flex; justify-content:space-between; }
  /* Long CoCo replies were clipped by a rigid box. The message now wraps and,
     only if it is genuinely long, scrolls inside a bounded bubble instead of
     pushing the canvas and tray off-screen. */
  /* min-height reserves the space a three-line reply needs, so short and long
     messages occupy the same box and the chrome budget stays constant. */
  #bubble .msg { margin-top:4px; font-size:17px; line-height:1.55;
    white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;
    min-height:68px; max-height:18vh; overflow-y:auto; }
  #hist { display:flex; gap:5px; align-items:center; }
  #hist button { background:#0E1F2E; color:var(--dim); border:1px solid var(--line);
    border-radius:4px; font:inherit; font-size:11px; padding:1px 7px; cursor:pointer; }
  #hist button:hover:not(:disabled) { color:var(--edge); border-color:var(--edge); }
  #hist button:disabled { opacity:.3; cursor:default; }
  #hist .at { font-size:10px; color:var(--dim); letter-spacing:.08em; }
  #histback { display:none; font-size:10px; color:var(--warm); margin-top:5px;
    letter-spacing:.1em; text-transform:uppercase; }
  #histback.on { display:block; }
  #yousaid { display:none; margin-top:6px; padding-top:6px;
    border-top:1px dashed #2B4A61; font-size:12px; color:var(--dim); }
  #yousaid.on { display:block; }

  /* ---------- HUD ---------- */
  #hud { display:flex; gap:7px; }
  .tile { flex:1; background:var(--panel); border:2px solid var(--line);
    border-radius:6px; padding:4px 9px; }
  .tile .k { font-size:9px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; }
  .tile .v { font-size:15px; font-weight:700; color:var(--edge); margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #stagebar { display:flex; gap:4px; }
  #stagebar div { flex:1; height:5px; background:var(--line); border-radius:3px; }
  #stagebar div.on { background:var(--edge); }
  #stagebar div.cur { background:var(--warm); }

  #stagewrap { position:relative; }
  canvas#cv { image-rendering:pixelated; display:block; border:3px solid var(--line);
    border-radius:8px; box-shadow:0 14px 40px rgba(0,0,0,.6); }
  /* The POV interior scene. Drawn procedurally in the same pixel style as the
     map, it sits over the board while you are "inside" a location or waking. */
  canvas#scene { image-rendering:pixelated; position:absolute; inset:0;
    width:100%; height:100%; display:none; border:3px solid var(--warm);
    border-radius:8px; z-index:30; }
  canvas#scene.on { display:block; }

  /* ---------- overlays ---------- */
  /* Fixed to the viewport, not the canvas: tying the card to the board once
     hid 40% of the panel (and the CONFIRM button) on a small window. */
  .ov { position:fixed; inset:0; z-index:40; display:none; align-items:center;
    justify-content:center; background:rgba(6,12,18,.9); }
  .ov.on { display:flex; }
  /* POV variant: the interior scene shows behind, so the backdrop is only a
     soft vignette and the card sits low, like a surface on the desk. */
  /* POV variant: the interior scene fills the stage and the panel docks as a
     solid "desk" band flush at the bottom, exactly as wide as the scene (width
     is set in JS to the canvas width) so it sits BELOW the view, not over it. */
  /* Top-anchored, NOT bottom-anchored. Pinning the panel to the foot of the
     viewport while the canvas sat at the top is what opened the dead strip
     between the interior and the text: two elements on opposite edges with the
     leftover height in between. sizePovCard() now places this card itself. */
  .ov.pov { background:transparent; align-items:flex-start; justify-content:center; }
  .ov.pov .card { margin:0; width:auto; max-height:52vh;
    background:rgba(12,22,31,.97);
    border-color:var(--edge); box-shadow:0 -8px 40px rgba(0,0,0,.75); }
  /* The home stage borrows the interior card but not sizePovCard(), which is
     driven by panelLoc and belongs to the locations. It only needs to sit under
     the house the way an interior panel sits under its room, so it anchors to
     the bottom and takes a fixed share of the height. */
  #ov-home.pov { align-items:flex-end; padding-bottom:14px; }
  #ov-home.pov .card { max-height:46vh; }
  /* The wake igloo is the first thing a visitor sees, so let it read: a soft
     vignette instead of the near-opaque default overlay. */
  /* CoCo's in-scene reply, embedded as a quiet quote (a left accent bar) rather
     than a boxed border that clashed with the panel edge. */
  .say { display:none; margin:4px 0 12px; padding:2px 0 2px 12px;
    border-left:3px solid var(--edge); background:transparent;
    font-size:16px; line-height:1.55; white-space:pre-wrap; word-break:break-word;
    max-height:24vh; overflow-y:auto; }
  .say.on { display:block; }
  .say b { color:var(--warm); font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; display:block; margin-bottom:3px; }

  /* ---------- the journey, as tiles ---------- */
  /* Four stops is enough to lose the thread. Rather than repeat CoCo in the
     bubble AND the panel, each finished stop is a tile you can tap open. */
  #c-prev { display:none; margin:2px 0 10px; }
  #c-prev.on { display:block; }
  .ptiles { display:flex; gap:4px; }
  .ptile { flex:1; background:var(--panel); border:2px solid var(--line);
    border-radius:6px; padding:3px 7px; min-width:0; }
  .ptile .k { font-size:9px; letter-spacing:.13em; color:var(--dim);
    text-transform:uppercase; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .ptile .v { font-size:11px; font-weight:700; color:#5E8399; margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ptile.done { cursor:pointer; border-color:var(--edge); }
  .ptile.done .v { color:var(--edge); }
  .ptile.done:hover { background:#12283A; }
  .ptile.done.open { border-color:var(--warm); background:#12283A; }
  .ptile.done.open .v { color:var(--warm); }
  .ptile.cur { border-color:var(--warm); }
  .ptile.cur .k, .ptile.cur .v { color:var(--warm); }
  .prevbody { display:none; margin-top:5px; padding:7px 10px 8px;
    font-size:13px; line-height:1.45; max-height:11vh; overflow-y:auto;
    background:#0A141C; border:1px solid var(--edge); border-radius:5px; }
  .prevbody.on { display:block; }
  .prevbody .lab { color:var(--warm); font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; display:block; margin:7px 0 2px; }
  .prevbody .txt { color:#8FB4CB; white-space:pre-wrap; word-break:break-word; }

  /* The action block docks at the foot of the scrolling card. */
  #ov-loc .card { display:flex; flex-direction:column; overflow:hidden; }
  .cscroll { flex:1 1 auto; overflow-y:auto; min-height:180px;
    /* A fade at the bottom edge, so a clipped list reads as scrollable rather
       than as a panel that is simply missing its options. */
    background:linear-gradient(var(--panel) 30%,rgba(11,22,31,0)) bottom/100% 18px
      no-repeat local; }
  .ov.pov .cscroll { min-height:0;
    background:linear-gradient(rgba(8,16,23,.92) 30%,
    rgba(8,16,23,0)) bottom/100% 18px no-repeat local; }
  .dock { flex:0 0 auto; background:var(--panel);
    padding-top:8px; margin-top:6px; border-top:1px solid var(--line); }
  .ov.pov .dock { background:transparent; }
  #c-more { display:none; flex:0 0 auto; align-self:center; margin:2px 0 0;
    font:700 11.5px/1 var(--ff); letter-spacing:.04em; color:#08131B;
    background:var(--warm); border-radius:10px; padding:5px 11px;
    cursor:pointer; }
  #c-more.on { display:block; }
  /* sparkly / shimmer text for the phrases CoCo is proudest of */
  .spark { background:linear-gradient(90deg,#29B5E8 0%,#EAF6FD 25%,#E8863C 50%,#EAF6FD 75%,#29B5E8 100%);
    background-size:200% auto; -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent; font-weight:700;
    animation:shimmer 3.2s linear infinite; }
  @keyframes shimmer { to { background-position:200% center; } }
  /* A flat highlight colour, not the shimmer: used for the privacy promise in
     the intro, which needs to stand out without looking like marketing. */
  .ihl { color:#6FD3F2; font-weight:700; }
  /* roomier spacing on the combined wake + details card */
  .card { width:min(700px,94vw); max-height:88vh; overflow:auto; background:var(--panel);
    border:3px solid var(--warm); border-radius:10px; padding:14px 18px 16px; }
  .card h2 { margin:0; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--warm); }
  .card .sub { font-size:12px; color:var(--dim); margin-top:2px; }
  /* Booth reading distance: the visitor is standing, often a metre back, so the
     words CoCo says and the question being asked both run larger than chrome. */
  .card .q { margin:11px 0 3px; font-size:18px; }
  .card .hint { font-size:13.5px; color:var(--dim); margin-bottom:9px; }

  /* checklist: the panel carries STRUCTURE, never the narrative */
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  @media (max-width:700px){ .opts { grid-template-columns:1fr; } }
  .opt { display:flex; gap:8px; align-items:flex-start; background:#0A141C;
    border:2px solid #24425A; border-radius:6px; padding:7px 9px; cursor:pointer; }
  .opt:hover { border-color:var(--edge); }
  .opt.sel { border-color:var(--warm); background:#17222B; }
  .opt input { margin:2px 0 0; accent-color:var(--warm); flex:none; }
  .opt .lb { font-size:13px; line-height:1.3; }
  .opt .nt { font-size:11px; color:var(--dim); margin-top:2px; line-height:1.3; }

  input[type=text], input[type=email], select { width:100%; background:#0A141C;
    color:var(--text); font:inherit; font-size:14px; border:2px solid #2B4A61;
    border-radius:6px; padding:8px 10px; }
  input:focus, select:focus { outline:none; border-color:var(--edge); }
  .fld { margin-bottom:8px; }
  .fld label { display:block; font-size:11px; color:var(--dim); margin-bottom:3px;
    letter-spacing:.08em; text-transform:uppercase; }
  .cchoose { display:block; width:100%; padding:7px 0; margin-bottom:6px;
    background:transparent; border:2px solid var(--edge); border-radius:5px;
    color:var(--edge); font:700 12px/1 var(--ff); letter-spacing:.08em;
    cursor:pointer; text-transform:uppercase; }
  .cchoose:hover { background:var(--edge); color:var(--panel); }
  .go { margin-top:11px; display:flex; gap:9px; align-items:center; }
  button.primary { background:var(--warm); color:#101C27; border:none; font:inherit;
    font-weight:700; font-size:14px; letter-spacing:.06em; border-radius:6px;
    padding:9px 18px; cursor:pointer; }
  button.primary:hover { filter:brightness(1.12); }
  button.primary:disabled { opacity:.45; cursor:default; filter:none; }
  .go .keys { font-size:11px; color:#5E8399; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
  .chip { padding:6px 11px; border:1px solid var(--line); border-radius:12px;
    background:#0A141C; color:#8FB4CB; font:600 13px/1 var(--ff);
    cursor:pointer; user-select:none; }
  .chip:hover { border-color:var(--edge); }
  .chip.on { background:var(--edge); border-color:var(--edge); color:#08131B; }
  /* The submit button is the only thing in the panel that DOES anything, so it
     stops being a small pill sitting next to grey hint text and becomes the
     width of the panel with a lit edge. In testing CONFIRM was being read as a
     caption rather than a control, and visitors waited for something to happen. */
  .go .primary { flex:1 1 auto; padding:13px 16px; font-size:15px;
    letter-spacing:.10em; }
  .go .primary:not(:disabled) { animation:goPulse 2.6s ease-in-out infinite; }
  @keyframes goPulse {
    0%,100% { box-shadow:0 0 0 2px rgba(232,134,60,.30),
                         0 6px 18px rgba(0,0,0,.45); }
    50%     { box-shadow:0 0 0 6px rgba(232,134,60,.10),
                         0 8px 22px rgba(0,0,0,.52); }
  }
  /* "ESC to step away" was sharing the row and eating a quarter of the
     button's width, which is exactly why it still read as a pill rather than a
     bar. In POV the hint moves under the button. */
  .ov.pov .go { flex-wrap:wrap; }
  .ov.pov .go .keys { flex:1 0 100%; text-align:center; margin-top:5px; }
  /* Disabled keeps a dim ring: with no shadow at all the control vanished into
     the panel at exactly the moment the visitor had not yet acted. */
  .go .primary:disabled { animation:none;
    box-shadow:0 0 0 1px rgba(232,134,60,.20); }
  input.invalid { border-color:#FF7A7A !important; }

  /* ---------- the take-it-with-you handover ---------- */
  #bp-hand { display:none; gap:14px; margin-top:14px; padding:12px;
    align-items:center; background:#0A141C; border:2px solid var(--edge);
    border-radius:8px; }
  #bp-hand.on { display:flex; }
  #bp-qr { background:#FFF; border-radius:4px; flex:0 0 auto; display:block; }
  #bp-hand .handh { color:var(--warm); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; margin-bottom:4px; }
  #bp-hand .handp { font-size:13px; line-height:1.5; color:#9FC2D6; }
  #bp-hand .handlink { display:inline-block; margin-top:7px; font-size:11px;
    color:var(--edge); word-break:break-all; text-decoration:none;
    border-bottom:1px dotted var(--edge); }
  #bp-hand .handlink:hover { color:var(--text); }

  /* ---------- reasoning tray: replaces "CoCo is thinking" ---------- */
  #tray { background:#0C1720; border:2px solid var(--line); border-radius:6px;
    font-size:11px; overflow:hidden; }
  #trayhead { display:flex; gap:8px; align-items:center; padding:5px 10px;
    cursor:pointer; color:var(--dim); }
  #trayhead:hover { color:var(--text); }
  #trayhead .dot { width:7px; height:7px; border-radius:50%; background:#2B4A61; flex:none; }
  #trayhead.live .dot { background:var(--edge); animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.25;transform:scale(.8)} 50%{opacity:1;transform:scale(1.25)} }
  #traynow { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-size:11px; color:var(--dim); }
  #trayhead.live #traynow { color:var(--edge); }
  #trayhead .chev { font-size:10px; letter-spacing:.1em; }
  #traybody { display:none; max-height:132px; overflow:auto; padding:0 10px 8px;
    border-top:1px solid var(--line); }
  #traybody.on { display:block; }
  #traybody div { color:#8FB4CB; line-height:1.45; padding:1px 0;
    white-space:pre-wrap; word-break:break-word; }

  #banner { position:absolute; inset:0; display:none; align-items:center;
    justify-content:center; flex-direction:column; background:rgba(10,18,26,.92);
    border-radius:8px; }
  #banner.on { display:flex; }
  #banner h1 { font-size:52px; margin:0; color:var(--edge); letter-spacing:.06em;
    text-shadow:0 0 18px rgba(41,181,232,.5); }
  #banner p { color:var(--dim); letter-spacing:.2em; }
  /* The byline sits tight under the title, quieter than PRESS START so it reads
     as attribution rather than as an instruction. */
  #b-by { margin:6px 0 18px; color:var(--warm); font-size:13px;
    letter-spacing:.16em; text-transform:none; opacity:.9; }
  #err { position:fixed; left:8px; bottom:5px; color:#FF7A7A; font-size:11px; }
  #newv { position:fixed; right:9px; top:7px; z-index:60; background:#16283A;
    color:var(--dim); border:1px solid var(--line); border-radius:5px; font:inherit;
    font-size:10px; letter-spacing:.12em; padding:4px 9px; cursor:pointer; }
  #newv:hover { color:var(--warm); border-color:var(--warm); }
  /* Keep the history arrows clear of the fixed NEW VISITOR pill, which was
     slicing the top of both glyphs. */
  #hist { margin-right:104px; }
  /* blueprint reveal: the visitor must leave with the thing they built */
  #bp { text-align:left; }
  #bp h3 { font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--warm); margin:14px 0 4px; }
  #bp ul { margin:4px 0; padding-left:18px; font-size:13px; line-height:1.5; }
  #bp pre { background:#0A141C; border:2px solid #24425A; border-radius:6px;
    padding:10px; font-size:11px; line-height:1.45; max-height:190px; overflow:auto;
    white-space:pre-wrap; word-break:break-word; color:#CFE6F5; }
  #bp .score { font-size:15px; color:var(--edge); }
  #bp a { color:var(--edge); }
  /* ---------- the letter: beige paper, dark ink, pulls up from the envelope ---------- */
  /* Centred, not bottom-anchored: flush to the floor the letter looked like
     a dropped toolbar and the bubble above it had nowhere to sit. */
  #ov-letter { align-items:center; }
  /* CoCo reacts to the letter he has just been handed, above the paper itself. */
  .lwrap { display:flex; flex-direction:column; align-items:center;
    width:min(600px,94vw); margin:2vh 0 6vh; perspective:900px; }
  .lbubble { position:relative; background:#16283A; border:3px solid var(--edge);
    opacity:0; transform:translateY(8px); transition:opacity .5s ease .95s,
    transform .5s ease .95s;
    border-radius:14px; padding:10px 14px; margin-bottom:16px;
    color:#EAF6FD; font-size:14px; line-height:1.5; text-align:center;
    font-family:ui-monospace,monospace; box-shadow:0 0 26px rgba(41,181,232,.16); }
  .lbubble:after { content:''; position:absolute; bottom:-10px; left:50%;
    margin-left:-9px; width:0; height:0; border-style:solid;
    border-width:11px 9px 0 9px;
    border-color:var(--edge) transparent transparent transparent; }
  .card.letter {
    background:#EFE6D2; border:2px solid #B9A98A; border-radius:4px;
    color:#2A2418; width:100%; max-height:66vh; overflow-y:auto;
    box-shadow:0 -8px 28px rgba(0,0,0,.55); margin:0;
    padding:22px 26px 26px;
    transform:translateY(118%) rotateX(26deg) scale(.94);
    transform-origin:50% 100%;
    transition:transform .7s cubic-bezier(.4,0,.7,.2);
    font-family:Georgia,'Iowan Old Style',serif;
  }
  #ov-letter.on .lbubble { opacity:1; transform:translateY(0); }
  /* Two-stage: the sheet is pulled out of the envelope (fast, tilted) then
     settles flat with a small overshoot, rather than one flat slide. */
  #ov-letter.on .card.letter {
    transform:translateY(0) rotateX(0deg) scale(1);
    transition:transform 1.05s cubic-bezier(.13,1.02,.22,1.0),
               box-shadow .9s ease .2s;
    box-shadow:0 22px 60px rgba(0,0,0,.62);
  }
  /* Lead the eye to what actually needs filling in. */
  #ov-letter.on .card.letter .lin { animation:lglow 1.5s ease-out both; }
  #ov-letter.on .card.letter #l-first    { animation-delay:1.15s; }
  #ov-letter.on .card.letter #l-company  { animation-delay:1.40s; }
  #ov-letter.on .card.letter #l-industry { animation-delay:1.65s; }

  #ov-letter.on .card.letter #l-problem  { animation-delay:1.90s; }
  @keyframes lglow {
    0%   { background:rgba(28,78,122,0);   border-bottom-color:#9C8C6E; }
    35%  { background:rgba(232,134,60,.22); border-bottom-color:#B4442E; }
    100% { background:rgba(28,78,122,0);   border-bottom-color:#9C8C6E; }
  }
  .card.letter .lgreet { font-size:19px; margin-bottom:12px; }
  .card.letter .lsign { margin-top:14px; font-style:italic; opacity:.85; }
  /* The stack and location questions inside the letter. Set apart from the
     handwriting so they read as CoCo asking, not as more of the letter. */
  .card.letter .lask { margin-top:14px; padding-top:12px;
    border-top:1px dashed rgba(41,181,232,.30); }
  .card.letter .laskq { font-size:15px; font-weight:700; margin-bottom:7px;
    color:#0E2436; }
  .card.letter .lask .chip { background:rgba(14,36,54,.06); color:#274A5F;
    border-color:rgba(14,36,54,.22); }
  .card.letter .lask .chip.on { background:#1E6F94; border-color:#1E6F94;
    color:#F2FAFF; }
  .card.letter .lask .fld { margin-top:8px; }
  /* "CoCo, you choose" - for the visitor who knows they want something but
     cannot phrase it at a noisy stand. Understated, because typing their own
     problem is still the better outcome. */
  .card.letter .lsug { display:flex; align-items:center; gap:9px; margin-top:6px; }
  .card.letter .sugbtn { background:rgba(30,111,148,.10); color:#1E6F94;
    border:1px dashed rgba(30,111,148,.55); border-radius:12px;
    font:600 12px/1 var(--ff); padding:6px 11px; cursor:pointer; }
  .card.letter .sugbtn:hover { background:rgba(30,111,148,.18); }
  .card.letter .sugbtn:disabled { opacity:.55; cursor:default; }
  .card.letter .sughint { font-size:11.5px; color:#5E8399; }
  .card.letter .lp { font-size:15px; line-height:1.9; margin:0 0 7px; }
  .card.letter .lin {
    background:transparent; border:0; border-bottom:2px solid #9C8C6E;
    color:#1C4E7A; font:inherit; font-size:15px; padding:0 4px 1px;
    border-radius:0;
    /* Must stay inline: the global input rule stretches these to full width,
       which tore each sentence across three lines and stranded the "!". */
    width:auto; display:inline-block; vertical-align:baseline;
  }
  #l-first { width:150px; } #l-company { width:205px; }
  #l-industry { width:195px; }
  .lta { display:block; margin-top:5px; resize:vertical;
    font:inherit; font-size:14px; line-height:1.5; }
  /* The problem field is the only input that is a PARAGRAPH rather than a word
     dropped into a sentence, so it is the one input that must NOT stay inline.
     `.card.letter .lin` is the more specific selector, so its `width:auto` beat
     `.lta`'s `width:100%` and the box rendered as a stubby stump mid-sentence.
     Overridden here, at equal specificity plus one, and given a real ruled box:
     a full-width field with only an underline reads as a broken table row. */
  .card.letter .lin.lta {
    width:100%; box-sizing:border-box; display:block;
    border:1px solid #C6B79A; border-bottom:2px solid #9C8C6E;
    border-radius:3px; padding:8px 9px;
    background:rgba(255,255,255,.45);
  }
  .card.letter .lin.lta:focus { border-color:#1C4E7A; }
  .card.letter .lin:focus { outline:none; border-bottom-color:#1C4E7A; background:rgba(28,78,122,.06); }
  .card.letter .lin.invalid { border-bottom-color:#B4442E; background:rgba(180,68,46,.08); }
  .card.letter .lsel { min-width:170px; color-scheme:light; }
  /* An option with no background inherits the OS popup colour: on a dark-mode
     machine that paints dark text on dark. Pin both. */
  .card.letter .lsel option { color:#2A2418; background-color:#FFFFFF; }
  .card.letter .lhint { font-size:12px; color:#8A3524; font-family:ui-monospace,monospace; }
  .card.letter .primary { font-family:ui-monospace,monospace; }
  /* CoCo's spoken beats over the house scene */
  .hsay { display:none; position:absolute; left:50%; transform:translateX(-50%);
    bottom:16vh; z-index:40; max-width:min(600px,90vw);
    background:rgba(10,22,34,.92); border:2px solid var(--edge); border-radius:6px;
    padding:10px 14px; color:#EAF6FD; font-size:15px; line-height:1.5; text-align:center; }
  .hsay.on { display:block; }
</style>
</head>
<body>
<div id="wrap">

  <!-- CoCo's voice, at the top, in a thought bubble. No caret: nothing here
       should read as a text input. -->
  <div id="bubble" class="rail">
    <div class="who"><span>CoCo</span>
      <span id="hist">
        <button id="h-prev" title="Previous">&#9664;</button>
        <span class="at" id="h-at"></span>
        <button id="h-next" title="Next">&#9654;</button>
      </span></div>
    <div class="msg" id="d-msg"></div>
    <div id="yousaid"></div>
    <div id="histback"></div>
  </div>

  <!-- what CoCo is actually doing, expandable. Sits under the bubble so it never
       collides with the POV desk panel docked at the bottom of the stage. -->
  <div id="tray" class="rail">
    <div id="trayhead"><span class="dot"></span>
      <span id="traynow">Idle</span><span class="chev" id="traychev">SHOW WORK &#9662;</span></div>
    <div id="traybody"></div>
  </div>

  <div id="hud" class="rail">
    <div class="tile"><div class="k">Player</div><div class="v" id="h-name">&mdash;</div></div>
    <div class="tile"><div class="k">Industry</div><div class="v" id="h-ind">&mdash;</div></div>
    <div class="tile"><div class="k">Progress</div><div class="v" id="h-col">0 / 4</div></div>
    <div class="tile"><div class="k">Time</div><div class="v" id="h-time">0:00</div></div>
  </div>
  <div id="stagebar" class="rail"></div>

  <div id="stagewrap">
    <canvas id="cv"></canvas>
    <canvas id="scene"></canvas>

    <!-- opening title: a plain statement of what this is, no narrative -->
    <div class="ov" id="ov-title"><div class="card" style="text-align:center;border-color:var(--edge);width:min(640px,94vw)">
      <div id="t-title" class="spark" style="font-size:34px;font-weight:800;letter-spacing:.03em;margin:2px 0 12px"></div>
      <div id="t-body" style="font-size:15px;line-height:1.6;color:#CFE6F5;text-align:left"></div>
      <div class="go" style="justify-content:center;margin-top:16px">
        <button class="primary" id="t-go">START</button></div>
    </div></div>

    <!-- The one unscripted stop. Optional and skippable, always real CoCo. -->
    <div class="ov" id="ov-ask"><div class="card" style="border-color:var(--edge)">
      <h2 id="a-head" style="color:var(--edge)"></h2>
      <div class="hint" id="a-hint" style="margin-top:2px"></div>
      <div class="fld" style="margin-top:12px">
        <input type="text" id="a-text" autocomplete="off" spellcheck="false"></div>
      <div class="go" style="margin-top:12px">
        <button class="primary" id="a-go">ASK COCO</button>
        <button id="a-skip">SKIP THIS</button></div>
    </div></div>

    <!-- Opening beat 1: the arctic title card -->
    <div class="ov" id="ov-arctic"><div class="card" style="text-align:center;border-color:var(--edge);width:min(620px,94vw);background:rgba(10,22,34,.92)">
      <div id="a-arctic" style="font-size:28px;font-weight:800;letter-spacing:.03em"></div>
      <div id="a-arcticsub" class="hint" style="margin-top:8px;font-size:13px"></div>
    </div></div>

    <!-- Opening beat 2: the letter pulls up out of the envelope AND is the intake -->
    <div class="ov" id="ov-letter"><div class="lwrap">
      <div class="lbubble" id="l-bubble"></div>
      <div class="card letter">
      <div id="l-greet" class="lgreet"></div>
      <!-- The letter's sentences are built from config.intake.letter.body, not
           written here. They used to be hardcoded, which meant the copy in
           config was dead data: editing it changed the decision-tree document
           and never changed the screen. The inputs are substituted into the
           {first_name}, {company} and {industry} placeholders. -->
      <div id="l-body"></div>
      <!-- The stack and the location are part of the letter, not a separate
           screen afterwards. They are things the visitor's colleague would
           mention in a letter, and asking them here saves a blocking gate in a
           five-minute visit. Residency is INFERRED from the location rather
           than asked: nothing branches on it, it only names the region in the
           blueprint's sovereignty pillars. -->
      <div class="lask" id="l-stack">
        <div class="laskq" id="l-stackq"></div>
        <div class="opts chips" id="l-stackchips"></div>
      </div>
      <div class="lask" id="l-loc">
        <div class="laskq" id="l-locq"></div>
        <div class="opts chips" id="l-locchips"></div>
        <div class="fld" id="l-locotherwrap" style="display:none">
          <input type="text" id="l-locother" class="lin" autocomplete="off"
            spellcheck="false" placeholder="Type it if it's not here"></div>
      </div>

      <div class="go" style="margin-top:14px;justify-content:space-between;align-items:center">
        <span id="l-hint" class="lhint"></span>
        <button class="primary" id="l-go">THAT'S BETTER</button></div>
    </div></div></div>

    <!-- CoCo speaking over the house scene, between the letter and the map -->
    <div id="h-say" class="hsay"></div>

    <!-- Home-stage question gate. Between the letter and the map, CoCo asks
         where the data lives, where the company is based, and the residency
         rules. Blocking and click-only: the map stays locked until answered. -->
    <!-- Shaped like an INTERIOR, deliberately. These three questions used to
         wear the letter's styling in a centred box, which made them read as
         paperwork bolted on after the letter rather than as CoCo asking. So it
         now carries the same furniture as the library, the marketplace and the
         workshop: CoCo's line in .say, the question in .q, the hint under it,
         chips in .opts, and the confirm docked at the bottom. -->
    <div class="ov pov" id="ov-home"><div class="card" style="width:min(1320px,96vw)">
      <div class="cscroll">
        <div class="say" id="hq-bubble"></div>
        <div class="q" id="hq-heading"></div>
        <div class="hint" id="hq-hint"></div>
        <div class="opts chips" id="hq-chips"></div>
      </div>
      <div class="dock">
        <div class="fld" id="hq-otherwrap" style="display:none">
          <input type="text" id="hq-other" autocomplete="off" spellcheck="false"
            placeholder="Type it if it's not here"></div>
        <div class="go"><button class="primary" id="hq-go">CONFIRM</button>
          <span class="keys" id="hq-step"></span></div>
      </div>
    </div></div>

    <!-- per-location panel -->
    <div class="ov" id="ov-loc"><div class="card">
      <!-- Scroll region + fixed footer. A sticky footer inside one scroll box
           painted its opaque band over the middle of the option list, hiding a
           choice the visitor never knew was there. -->
      <div class="cscroll" id="c-scroll">
      <h2 id="c-loc"></h2>
      <div class="sub" id="c-rep"></div>
      <!-- The journey as four tiles, matching the HUD at the top of the page.
           A full-width "EARLIER - THE DATA LIBRARY" bar read as a stray toolbar;
           this reads as progress you can tap. -->
      <div id="c-prev">
        <div class="ptiles" id="c-ptiles"></div>
        <div class="prevbody" id="c-prevbody"></div>
      </div>
      <div class="say" id="c-say"></div>
      <div class="q" id="c-head"></div>
      <div class="hint" id="c-hint"></div>
      <div class="opts" id="c-opts"></div>
      </div><!-- /cscroll -->
      <!-- Overflow cue. The 18px fade at the bottom of .cscroll is too subtle at
           booth distance: with six listings and room for four, visitors were
           never finding the last two. This says so in words, and only when the
           list actually overflows. -->
      <div id="c-more">▼ <span id="c-morecount"></span> more below</div>
      <!-- Docked last: what you type is the action, so it sits under the
           conversation and stays reachable however long CoCo's reply is. -->
      <div class="dock" id="c-dock">
        <!-- The library's second question. One tap, and it decides the whole
             "getting your data in" section of the blueprint, so it is worth
             asking here rather than guessing later. -->
        <div class="fld" id="c-otherwrap" style="margin-top:8px">
          <label id="c-otherlab"></label>
          <input type="text" id="c-other" autocomplete="off" spellcheck="false"></div>
        <div class="fld" id="c-composewrap" style="display:none">
          <button class="cchoose" id="c-coco-choose" style="display:none">LET COCO CHOOSE</button>
          <input type="text" id="c-compose" autocomplete="off" spellcheck="false"></div>
        <div class="go"><button class="primary" id="c-go">CONFIRM</button>
          <span class="keys">ESC to step away</span></div>
      </div>
    </div></div>

    <div id="banner"><h1 id="b-title">LOCO 4 CoCo</h1>
      <p id="b-by"></p>
      <p id="b-sub">PRESS START</p></div>
  </div>

  <!-- The finished blueprint, on screen. The QR handover IS the delivery: demo
       laptops keep nothing local, so the brief, the Cortex Code prompt and the
       Word document all travel by presigned link, scanned off the screen. -->
  <div class="ov" id="ov-bp"><div class="card">
    <h2 id="bp-h2">Ready to post</h2>
    <div class="sub" id="bp-sub"></div>
    <div id="bp"></div>
    <!-- Tier 2 handover. This block is the thing that cannot fail: it is the
         only way the visitor takes the document away from the stand. -->
    <div id="bp-hand">
      <img id="bp-qr" alt="Scan to download your blueprint" width="150" height="150">
      <div class="handtxt">
        <div class="handh" id="bp-handh"></div>
        <div class="handp" id="bp-handp"></div>
        <a id="bp-link" class="handlink" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <div class="go"><button class="primary" id="bp-send">POST IT TO ME</button>
      <span class="keys" id="bp-keys">Builds your document and your QR code</span></div>
  </div></div>
  <div class="ov" id="ov-done" style="display:none"><div class="card" style="max-width:420px;text-align:center;padding:28px 24px">
    <div style="font-size:32px;color:#29B5E8;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:14px">
      <img src="/assets/snowflake-mark.png" alt="" width="36" height="36" style="image-rendering:auto">
      DONE
      <img src="/assets/snowflake-mark.png" alt="" width="36" height="36" style="image-rendering:auto">
    </div>
    <div id="done-who" style="font-size:15px;font-weight:700;color:var(--edge);margin:8px 0"></div>
    <div id="done-poc" style="font-size:13px;color:var(--dim);margin:4px 0"></div>
    <div id="done-feats" style="font-size:13px;color:var(--dim);margin:4px 0"></div>
    <div id="done-time" style="font-size:22px;font-weight:700;color:var(--edge);margin:18px 0"></div>
    <img id="done-cardimg" alt="Your card" style="display:block;width:100%;
      border-radius:8px;margin:14px 0 4px;image-rendering:pixelated">
    <div id="done-hand" style="display:none;align-items:center;gap:12px;
      margin:10px 0 0;padding:10px;border:1px solid var(--line);border-radius:8px;
      text-align:left">
      <img id="done-qr" alt="" width="96" height="96"
        style="background:#FFF;border-radius:4px;flex:0 0 auto;display:block">
      <div style="font-size:12px;line-height:1.5;color:#9FC2D6">
        <b style="color:var(--edge)" id="done-cardh"></b><br>
        <span id="done-cardp"></span>
      </div>
    </div>
    <div class="hint" id="done-cardhint" style="margin:8px 0 0">Getting your card
      ready to scan…</div>
    <button class="primary" id="done-card" style="margin-top:8px;padding:8px 14px;
      font-size:11px;width:100%;opacity:.55">SAVE A COPY TO THIS MACHINE
      (OPERATOR)</button>
    <button class="primary" id="done-reset" style="margin-top:14px;padding:10px 28px;font-size:14px">START AGAIN</button>
  </div></div>


</div>
<div id="err"></div>
<button id="newv" title="Clear this visitor and start fresh">NEW VISITOR</button>

<script>
const $ = id => document.getElementById(id);
const showErr = m => { $('err').textContent = m || ''; };
const esc = s => String(s==null?'':s);

let CFG=null, ST={}, OPTS={}, T=16, S=3, COLS=22, ROWS=15, map=[], ctx=null, tick=0;
let nearId=null, panelOpen=false, panelLoc=null, visited=new Set();
let histIdx=null;            // null = live; otherwise an index into ST.turns
let sel=new Set();
let nudgeMsg='', nudgeUntil=0, overNudged=false;
// A short-lived line in the bubble for things that are not a CoCo turn.
function nudge(m,ms){ nudgeMsg=m; nudgeUntil=Date.now()+(ms||3200); }
// A nudge can be dismissed with a tap on CoCo's bubble - used by the soft
// five-minute notice, which should never feel like it is holding the visitor.
addEventListener('DOMContentLoaded',()=>{
  const b=$('bubble'); if(b) b.addEventListener('click',()=>{ nudgeUntil=0; });
});

const rng = seed => { let s=seed>>>0; return () => (s=(s*1664525+1013904223)>>>0)/4294967296; };
const inb = (x,y) => x>=0 && y>=0 && x<COLS && y<ROWS;
const walkable = (x,y) => inb(x,y) && ![4,5,6,7].includes(map[y][x]);
const unlocked = id => (ST.unlocked||['library']).includes(id);
const haveVisitor = () => !!(ST.visitor && ST.visitor.first_name);

// 0 snow 1 snow_alt 2 ice 3 path 4 sea 5 pine 6 rock 7 structure
function buildMap(){
  const r=rng(CFG.render.seed); map=[];
  for(let y=0;y<ROWS;y++){ const row=[];
    for(let x=0;x<COLS;x++){
      if(y>=CFG.scenery.sea_from_row) row.push(4);
      else if(x===0||y===0||x===COLS-1) row.push(6);
      else { const n=r(); row.push(n<0.10?2:n<0.30?1:0); }
    } map.push(row);
  }
  CFG.scenery.pines.forEach(([x,y])=>{ if(inb(x,y)) map[y][x]=5; });
  CFG.scenery.rocks.forEach(([x,y])=>{ if(inb(x,y)) map[y][x]=6; });
  const ids=Object.keys(CFG.locations);
  for(let i=0;i<ids.length-1;i++) carve(CFG.locations[ids[i]].tile, CFG.locations[ids[i+1]].tile);
  carve(CFG.penguin.start, CFG.locations[ids[0]].tile);
  Object.values(CFG.locations).forEach(l=>{ const [x,y]=l.tile; if(inb(x,y)) map[y][x]=7; });
}
function carve(a,b){ let [x,y]=a;
  const soft=()=>{ if(inb(x,y)&&map[y][x]!==7&&map[y][x]!==4) map[y][x]=3; };
  while(x!==b[0]){ x+=Math.sign(b[0]-x); soft(); }
  while(y!==b[1]){ y+=Math.sign(b[1]-y); soft(); }
}

// ---------------- penguin ----------------
const P={ x:11,y:11,px:11,py:11,dir:'down',frame:0,moving:0,fromX:11,fromY:11 };
const keys={};
let reopenLock=0;
const blocking = () => panelOpen || $('ov-title').classList.contains('on')
  || $('ov-arctic').classList.contains('on')
  || $('ov-letter').classList.contains('on')
  || $('ov-home').classList.contains('on')
  || $('ov-ask').classList.contains('on')
  || $('ov-bp').classList.contains('on');
addEventListener('keydown',e=>{
  // Movement swallows w/a/s/d with preventDefault, so a focused field lost those
  // letters entirely: typing "paddy" produced "py". Any editable target gets the
  // key first, whatever else is going on. Escape still falls through to close.
  const t=e.target, tag=((t && t.tagName) || '').toLowerCase();
  if(e.key!=='Escape' && (tag==='input' || tag==='select' || tag==='textarea'
      || (t && t.isContentEditable))) return;
  if(blocking()){
    if(e.key==='Escape'){ if(panelOpen) closePanel(); else closeBp(); }
    return;
  }
  const k=e.key.toLowerCase();
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys[k]=true; e.preventDefault(); }
  if((k==='e'||k==='enter')&&nearId) openPanel(nearId);
  if(k==='[') stepHist(-1);
  if(k===']') stepHist(1);
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

function wanted(){
  if(keys['w']||keys['arrowup'])    return [0,-1,'up'];
  if(keys['s']||keys['arrowdown'])  return [0, 1,'down'];
  if(keys['a']||keys['arrowleft'])  return [-1,0,'left'];
  if(keys['d']||keys['arrowright']) return [1, 0,'right'];
  return null;
}
function stepMovement(){
  if(P.moving>0){
    P.moving--; const t=1-P.moving/7;
    P.px=P.fromX+(P.x-P.fromX)*t; P.py=P.fromY+(P.y-P.fromY)*t;
    if(P.moving===0){ P.px=P.x; P.py=P.y; }
    return;
  }
  const w=wanted();
  if(w){
    const [dx,dy,dir]=w; P.dir=dir;
    const nx=P.x+dx, ny=P.y+dy;
    if(walkable(nx,ny)){ P.fromX=P.x; P.fromY=P.y; P.x=nx; P.y=ny; P.moving=7; P.frame++; }
  }
  let found=null;
  for(const [id,l] of Object.entries(CFG.locations)){
    if(Math.abs(l.tile[0]-P.x)<=1 && Math.abs(l.tile[1]-P.y)<=1) found=id;
  }
  nearId=found;
}

function drawPenguin(g,sx,sy){
  const c=CFG.penguin,u=S;
  const px=(x,y,w,h,col)=>{ g.fillStyle=col; g.fillRect(sx+x*u,sy+y*u,w*u,h*u); };
  const o=(P.moving>0&&P.frame%2)?1:0;
  const fs=P.moving>0?(P.frame%2?1:-1):0;
  px(3+fs,14,3,2,c.foot); px(10-fs,14,3,2,c.foot);
  px(3,2+o,10,12,c.body); px(2,4+o,12,9,c.body); px(4,1+o,8,1,c.body);
  px(1,6+o,2,5,c.body_dark); px(13,6+o,2,5,c.body_dark);
  if(P.dir==='up'){ px(4,3+o,8,10,c.body_dark); return; }
  px(5,7+o,6,7,c.belly);
  if(P.dir==='down'){
    px(5,4+o,2,2,c.eye); px(9,4+o,2,2,c.eye); px(7,6+o,2,2,c.beak);
  } else {
    const f=P.dir==='left'?-1:1, cx=8+f*2;
    px(cx-1,4+o,2,2,c.eye); px(cx+f,6+o,3,2,c.beak);
  }
}

function drawStructure(g,kind,tx,ty,done){
  const th=CFG.theme,u=S,X=tx*T*S,Y=ty*T*S,w=T*S;
  const r=(x,y,ww,hh,col)=>{ g.fillStyle=col; g.fillRect(X+x*u,Y+y*u,ww*u,hh*u); };
  if(kind==='library'){
    // warm yellow body, dark grey peaked roof, two cyan windows, open book
    r(1,5,14,11,'#F2CC5C');               // body
    r(2,7,12,1,'#D4A830');                // horizontal band
    g.fillStyle='#3A3A42'; g.beginPath();  // peaked roof
    g.moveTo(X-1*u,Y+6*u); g.lineTo(X+w/2,Y+0*u); g.lineTo(X+w+1*u,Y+6*u);
    g.closePath(); g.fill();
    r(3,8,4,4,th.accent); r(9,8,4,4,th.accent); // windows
    r(6,10,4,6,'#3A3A42');                // door
    // open book above the door
    g.fillStyle='#F2F7FA';
    g.beginPath(); g.moveTo(X+w/2,Y+3*u); g.lineTo(X+w/2-3*u,Y+5*u);
    g.lineTo(X+w/2,Y+4.5*u); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(X+w/2,Y+3*u); g.lineTo(X+w/2+3*u,Y+5*u);
    g.lineTo(X+w/2,Y+4.5*u); g.closePath(); g.fill();
    g.fillStyle='#C4553E'; g.fillRect(X+w/2-0.5*u,Y+3*u,1*u,2*u); // spine
  } else if(kind==='marketplace'){

function drawGround(g){
  const th=CFG.theme, cols=[th.snow,th.snow_alt,th.ice,th.path,th.sea];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const t=map[y][x];
    g.fillStyle = (t===5||t===7)?th.snow : (t===6?th.snow_alt : (cols[Math.min(t,4)]||th.snow));
    g.fillRect(x*T*S,y*T*S,T*S,T*S);
    if(t===4){ g.fillStyle=th.sea_deep;
      if((x+y+Math.floor(tick/18))%3===0) g.fillRect(x*T*S,y*T*S+6*S,T*S,2*S); }
    if(t===5){ const X=x*T*S,Y=y*T*S;
      g.fillStyle='#6B4A2B'; g.fillRect(X+7*S,Y+11*S,2*S,5*S);
      for(let i=0;i<3;i++){ g.fillStyle=i%2?th.pine_dark:th.pine; g.beginPath();
        g.moveTo(X+T*S/2,Y+(1+i*3.5)*S); g.lineTo(X+(14-i)*S,Y+(7+i*3.5)*S);
        g.lineTo(X+(2+i)*S,Y+(7+i*3.5)*S); g.closePath(); g.fill(); }
      g.fillStyle=th.snow_bright; g.fillRect(X+6*S,Y+4*S,4*S,S);
    }
    if(t===6){ const X=x*T*S,Y=y*T*S;
      g.fillStyle=th.rock; g.fillRect(X+3*S,Y+7*S,10*S,7*S);
      g.fillStyle=th.snow_bright; g.fillRect(X+3*S,Y+7*S,10*S,2*S); }
  }
}

let flakes=[];
function drawSnowfall(g){

function render(){
  const g=ctx;
  g.fillStyle=CFG.theme.sky; g.fillRect(0,0,COLS*T*S,ROWS*T*S);
  drawGround(g);
  Object.entries(CFG.locations).forEach(([id,l])=>
    drawStructure(g,l.kind,l.tile[0],l.tile[1],visited.has(id)));
  drawPenguin(g,P.px*T*S,P.py*T*S);
  drawRoute(g);
  drawLabels(g);
  // Snow belongs outdoors. While the visitor is inside a location the board is
  // covered by #scene, so this only ever wasted frames - but gating it means
  // snow can never bleed into the library or the workshop, whatever changes
  // later to the scene canvas's opacity or size.
  if(!sceneActive) drawSnowfall(g);
}

// A gentle "go here next" cue: chevrons marching from the penguin toward the
// next unvisited location in the unlock order (Library -> Marketplace ->
// Workshop -> Postbox). Fades in only when the penguin is not already there.
function drawRoute(g){
  if(!haveVisitor()) return;
  const order=Object.keys(CFG.locations);
  const targetId=order.find(id=>!visited.has(id) && unlocked(id));
  if(!targetId || nearId===targetId) return;
  const tl=CFG.locations[targetId].tile;
  const px=P.px*T*S+T*S/2, py=P.py*T*S+T*S/2;
  const tx=tl[0]*T*S+T*S/2, ty=tl[1]*T*S+T*S/2;
  const dx=tx-px, dy=ty-py, len=Math.hypot(dx,dy);
  if(len<T*S*1.3) return;
  const ux=dx/len, uy=dy/len, ang=Math.atan2(uy,ux);
  // three chevrons that march toward the target
  const march=(tick/22)%1;
  const breath=0.58+0.16*Math.sin(tick/26);      // slow, not a flicker
  for(let i=0;i<2;i++){
    const d=T*S*1.1 + (i+march)*T*S*1.15;
    if(d>len-T*S*0.8) continue;
    const cx=px+ux*d, cy=py+uy*d;
    const a=breath-i*0.14;
    g.save(); g.translate(cx,cy); g.rotate(ang);
    g.strokeStyle=`rgba(232,134,60,${a})`; g.lineWidth=3*S/2;
    g.lineCap='round'; g.lineJoin='round';
    g.beginPath();
    g.moveTo(-4*S/2,-5*S/2); g.lineTo(4*S/2,0); g.lineTo(-4*S/2,5*S/2);
    g.stroke(); g.restore();
  }
}

// ---------------- POV interior scenes ----------------
// Drawn procedurally in the same pixel idiom as the map. Shown behind the
// library / marketplace panels and the wake-up screen so the interaction feels
// like it happens "at the desk", not in a floating box.
// ---- Real brand art, not pixel pastiche.
// The six-arm mark was hand-drawn three times and still read as a pinwheel,
// because the real thing is six THICK INWARD-POINTING chevrons around a rounded
// diamond with a hole in it - not a shape worth approximating at 60px. Load the
// actual files. They are ordinary static assets under /assets, served by the
// same handler as everything else.
const IMG={};
(function preload(){
  [['mark','/assets/snowflake-mark.png'],
   ['wordmark','/assets/snowflake-wordmark.png']].forEach(([k,src])=>{
    const im=new Image();
    im.onload=()=>{ IMG[k]=im; };
    im.onerror=()=>{ console.warn('[loco] asset missing:',src); };
    im.src=src;
  });
})();
// Both canvases run with imageSmoothingEnabled=false, which is right for the
// pixel art and wrong for a downscaled vector logo - unsmoothed it aliases into
// mush. Flip it for the one draw and put it back.
function drawImgSmooth(g,key,x,y,w,h){
  const im=IMG[key]; if(!im) return false;
  const was=g.imageSmoothingEnabled;
  g.imageSmoothingEnabled=true;
  g.drawImage(im,Math.round(x),Math.round(y),Math.round(w),Math.round(h));
  g.imageSmoothingEnabled=was;
  return true;
}

// Rounded rectangle as a PATH (caller fills or strokes). Canvas has
// roundRect() now, but not on every browser a booth laptop might have.
function rrect(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.arcTo(x+w,y,x+w,y+r,r);
  g.lineTo(x+w,y+h-r); g.arcTo(x+w,y+h,x+w-r,y+h,r);
  g.lineTo(x+r,y+h); g.arcTo(x,y+h,x,y+h-r,r);
  g.lineTo(x,y+r); g.arcTo(x,y,x+r,y,r);
  g.closePath();
}

let sceneActive=null, sceneCtx=null, sceneW=0, sceneH=0;
// drawScene runs off the animation loop and has no access to server state, so
// the in-flight status is mirrored here once per poll.
let sceneThinking=false;
// THE SAFE BAND. The POV panel is an overlay above the scene canvas, so panel
// height eats art. Every interior draws its furniture line at SAFE and keeps all
// detail above it, so the strip the panel covers is deliberately plain surface.
let postT=0;                           // when the posting beat started
const POST_MS=2600;
//
// SAFE is MEASURED, not assumed. It began as a constant, which broke on a short
// viewport: the panel has a minimum usable height, so when the scene got small
// the panel grew past the line the scenes were protecting and covered CoCo. The
// panel wins that argument - options must be reachable - so the art yields to it
// instead, and the furniture line lands on the real panel top at any size.
const BAND=0.44;                       // the band we ASK for when there is room
let SAFE=1-BAND;                       // the band we actually GOT, per frame
function measureSafe(){
  const card=document.querySelector('#ov-loc.on.pov .card'), cv=$('cv');
  if(!card || !cv){ SAFE=1-BAND; return; }
  // BOTH heights must be CSS pixels. Measuring the card (CSS) against sceneH
  // (the backing store, 720 tall on a 2x display) under-reserved the band by the
  // device ratio, which is exactly how much of CoCo ended up behind the panel.
  const cr=cv.getBoundingClientRect(), cssH=cr.height;
  if(!cssH){ SAFE=1-BAND; return; }
  // Where the panel's TOP is, not how tall it is. The panel is anchored to the
  // viewport and may hang below the canvas, and height alone counted that
  // overhang as covered art - 68px of scene we were refusing to draw in for no
  // reason. The top edge is the only thing the art has to stay clear of.
  const ch=cssH-(card.getBoundingClientRect().top-cr.top);
  // The floor is low on purpose. On a cramped window the panel needs more room
  // than the band would give it, and the honest answer is to compress the scene
  // rather than to paint furniture where the panel will cover it.
  SAFE=Math.max(0.18,Math.min(0.80,1-ch/cssH));
}

function drawCoCoFront(g,cx,cy,u){

  r(-5,-6,10,13,c.body); r(-6,-4,12,10,c.body); r(-4,-7,8,1,c.body);
  r(-6,-2,2,6,c.body_dark); r(4,-2,2,6,c.body_dark);
  r(-3,-1,6,7,c.belly);

}
// A loading animation that belongs to the character rather than the chrome:
// "Processing your request..." was only ever text in the panel, so the scene sat
// frozen while CoCo appeared to do nothing. Drawn in the same pixel idiom.
function drawThinkBubble(g,cx,cy,u){
  // Classic thought bubble: the cloud sits UP AND TO THE SIDE, with puffs
  // trailing diagonally back to the crown of his head (drawCoCoFront's head top
  // is at cy-7u). Two earlier versions each got half of this right - one trailed
  // from the beak at the correct angle, the other from the head straight up like
  // a lollipop. Origin is the head, angle is the diagonal.
  const bw=13*u, bh=7*u;
  const ax=cx+3*u, ay=cy-7*u;                            // anchor: crown, off-centre
  const bx=ax+2.5*u, by=cy-20*u;                         // cloud, up and right
  g.fillStyle='rgba(10,20,28,.55)';                      // soft drop
  g.fillRect(bx-u,by+u,bw,bh);
  g.fillStyle='#EAF6FD'; g.fillRect(bx,by,bw,bh);        // cloud body
  g.fillRect(bx+2*u,by-u,bw-4*u,bh+2*u);
  // three puffs shrinking along the diagonal from the crown up to the cloud
  g.fillStyle='#9FC2D6';
  // Smallest puff at the crown, growing toward the cloud: the trail should
  // read as a thought expanding outward, not shrinking into his head.
  const puffs=[[0.30,1.1],[0.62,1.6],[0.86,2.2]];
  for(const [t,s] of puffs){
    const px=ax+(bx+2*u-ax)*t, py=ay+(by+bh-ay)*t;
    g.fillRect(px-s*u/2, py-s*u/2, s*u, s*u);
  }
  // three dots, one lit at a time, so it reads as working not stuck
  const lit=Math.floor(tick/9)%3;
  for(let i=0;i<3;i++){
    g.fillStyle = i===lit ? '#E8863C' : '#B9CBD8';
    const d = i===lit ? 0.5*u : 0;
    g.fillRect(bx+2.5*u+i*3.2*u-d/2, by+2.5*u-d/2, 2*u+d, 2*u+d);
  }
}
function shelfBooks(g,x,y,w,u,seed){
  const r=rng(seed); let cx=x;
  const cols=['#C4553E','#3E7DA8','#C9A13B','#4F9E6A','#8A5FA8','#B5482F','#3C6E8F'];
  while(cx<x+w-u){ const bw=(1+Math.floor(r()*2))*u, bh=(6+Math.floor(r()*4))*u;
    g.fillStyle=cols[Math.floor(r()*cols.length)];
    g.fillRect(cx,y-bh,bw-1,bh); cx+=bw; }
}
function drawScene(kind){
  const g=sceneCtx, w=sceneW, h=sceneH, u=S, th=CFG.theme;
  measureSafe();                  // where the panel actually is, this frame
  if(kind==='house'){
    const p=openProg();
    const F=Math.sin(tick/7)*0.5+0.5;                 // fire flicker 0..1
    const FL=h*0.66;                                  // floor line
    // ---- walls: ice blocks with a lit top edge
    g.fillStyle='#0A1622'; g.fillRect(0,0,w,h);
    for(let by=0; by<FL; by+=h*0.105){
      for(let bx=0; bx<w; bx+=w*0.13){
        const alt=((bx/(w*0.13)|0)+(by/(h*0.105)|0))%2;
        g.fillStyle=alt?'#20364A':'#26415A';
        g.fillRect(bx+2,by+2,w*0.13-4,h*0.105-4);
        g.fillStyle='rgba(255,255,255,.04)';
        g.fillRect(bx+2,by+2,w*0.13-4,3);
      }
    }
    // ---- floor, boards fanning toward the viewer
    g.fillStyle='#152A3C'; g.fillRect(0,FL,w,h-FL);
    for(let i=0;i<9;i++){
      g.fillStyle=i%2?'rgba(255,255,255,.03)':'rgba(0,0,0,.10)';
      const x0=w*(i/9), x1=w*0.5+(x0-w*0.5)*1.9;
      g.beginPath(); g.moveTo(x0,FL); g.lineTo(x1,h); g.lineTo(x1+w*0.06,h);
      g.lineTo(x0+w*0.055,FL); g.closePath(); g.fill();
    }
    g.fillStyle='#0E1E2C'; g.fillRect(0,FL,w,4);
    // ---- window: night sky, moon, snow drifting past
    const wx=w*0.60, wy=h*0.09, ww=w*0.24, wh=h*0.26;
    g.fillStyle='#08121C'; g.fillRect(wx-5,wy-5,ww+10,wh+10);
    g.fillStyle='#0D2438'; g.fillRect(wx,wy,ww,wh);
    g.fillStyle='#EAF6FD'; g.fillRect(wx+ww*0.66,wy+wh*0.18,13,13);
    for(let i=0;i<16;i++){
      g.fillStyle='rgba(234,246,253,.55)';
      g.fillRect(wx+((i*37+tick*0.6)%ww),wy+((i*53+tick*1.4)%wh),S,S);
    }
    g.fillStyle='#2B4A61';
    g.fillRect(wx+ww/2-2,wy,4,wh); g.fillRect(wx,wy+wh/2-2,ww,4);
    g.strokeStyle='#3A5F7A'; g.lineWidth=4; g.strokeRect(wx,wy,ww,wh);
    // ---- fireplace: the room's light source
    const fx=w*0.80, fy=h*0.34, fw=w*0.15, fh=FL-fy;
    g.fillStyle='#243747'; g.fillRect(fx-8,fy-10,fw+16,fh+10);
    g.fillStyle='#08111A'; g.fillRect(fx,fy,fw,fh);
    g.fillStyle='#3A2A1C'; g.fillRect(fx+6,fy+fh-16,fw-12,10);
    g.fillStyle='#5A3D22'; g.fillRect(fx+10,fy+fh-22,fw-20,8);
    for(let i=0;i<5;i++){
      const bh=(14+i*4)*(0.7+F*0.5), bx=fx+fw*0.18+i*(fw*0.16);
      g.fillStyle=i%2?'#E8863C':'#F2C14E';
      g.fillRect(bx,fy+fh-22-bh,fw*0.13,bh);
    }
    const fg=g.createRadialGradient(fx+fw/2,fy+fh*0.7,10,fx+fw/2,fy+fh*0.7,w*0.52);
    fg.addColorStop(0,'rgba(232,134,60,'+(0.30+F*0.12)+')');
    fg.addColorStop(1,'rgba(232,134,60,0)');
    g.fillStyle=fg; g.fillRect(0,0,w,h);
    // ---- shelf of jars above the hearth
    g.fillStyle='#5A3D22'; g.fillRect(w*0.58,h*0.42,w*0.16,6);
    ['#4F9E6A','#3E7DA8','#C9A13B'].forEach((c,i)=>{ g.fillStyle=c;
      g.fillRect(w*0.59+i*(w*0.05),h*0.42-15,w*0.035,15); });
    // ---- Snowflake logo on the wall. The real mark, drawn from file.
    const sfx=w*0.375, sfy=h*0.155, sfr=h*0.075;
    drawImgSmooth(g,'mark',sfx-sfr,sfy-sfr,sfr*2,sfr*2);
    // ---- framed photo of the polar bear. The first version was a stack of
    // rectangles, which is fine for a 16px sprite and wrong for a photograph -
    // a bear is all curves. Ellipses and arcs, clipped to the frame.
    // Hung on the clear wall panel BETWEEN the logo and the window, and high
    // enough that its bottom edge (pfy+pfh) stays above the jar shelf at h*0.42.
    // It used to sit at w*0.625/h*0.275, which put it on top of the jars AND
    // over the bottom of the window - the frame was covering two things at once.
    const pfx=w*0.47, pfy=h*0.255, pfw=w*0.105, pfh=h*0.125;
    g.fillStyle='#4A3118'; g.fillRect(pfx-6,pfy-6,pfw+12,pfh+12);   // frame
    g.fillStyle='#7C5730'; g.fillRect(pfx-3,pfy-3,pfw+6,pfh+6);     // bevel
    const sky=g.createLinearGradient(0,pfy,0,pfy+pfh);
    sky.addColorStop(0,'#2C5570'); sky.addColorStop(1,'#6FA0B4');
    g.fillStyle=sky; g.fillRect(pfx,pfy,pfw,pfh);
    g.save(); g.beginPath(); g.rect(pfx,pfy,pfw,pfh); g.clip();
    // snow bank he is sitting on
    g.fillStyle='#DDEBF3'; g.beginPath();
    g.ellipse(pfx+pfw*0.5,pfy+pfh*1.05,pfw*0.80,pfh*0.32,0,0,7); g.fill();
    const bcx=pfx+pfw*0.44, bby=pfy+pfh*0.82, bs=pfw*0.29;
    g.fillStyle='#F5FAFD';
    g.beginPath(); g.ellipse(bcx,bby-bs*0.60,bs*1.10,bs*0.82,0,0,7); g.fill();
    g.beginPath(); g.ellipse(bcx-bs*0.80,bby-bs*0.34,bs*0.46,bs*0.56,0,0,7);
    g.fill();                                                       // haunch
    g.beginPath(); g.ellipse(bcx+bs*0.62,bby-bs*1.40,bs*0.54,bs*0.47,0,0,7);
    g.fill();                                                       // head
    g.beginPath(); g.arc(bcx+bs*0.30,bby-bs*1.76,bs*0.17,0,7); g.fill();
    g.beginPath(); g.arc(bcx+bs*0.94,bby-bs*1.74,bs*0.17,0,7); g.fill();
    g.fillStyle='#E6F0F7';                                          // muzzle
    g.beginPath(); g.ellipse(bcx+bs*1.02,bby-bs*1.26,bs*0.26,bs*0.19,0,0,7);
    g.fill();
    g.fillStyle='#1B2733';                                          // nose, eye
    g.beginPath(); g.ellipse(bcx+bs*1.20,bby-bs*1.28,bs*0.12,bs*0.09,0,0,7);
    g.fill();
    g.beginPath(); g.arc(bcx+bs*0.64,bby-bs*1.50,bs*0.075,0,7); g.fill();
    // The scarf sat across the muzzle and read as a blue stripe on his face.
    // It belongs at the neck: lower, narrower, and tucked behind the head.
    g.fillStyle='#29B5E8';
    g.beginPath(); g.ellipse(bcx+bs*0.52,bby-bs*0.92,bs*0.34,bs*0.12,-0.30,0,7);
    g.fill();
